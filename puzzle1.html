<!DOCTYPE html>
<html lang="en">
<head>
    <title>Puzzle 1 - Broken Tablet</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background-color: #110800; }
        #ui {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFD700;
            font-family: serif;
            font-size: 18px;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 10px #FF6600;
        }
    </style>
</head>
<body>

<div id="ui">
    Restore the sacred tablet...<br>
    <span id="progress">0 / 6 pieces placed</span>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
    }
}
</script>

<script type="module">

    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // -------------------------------------------------------------------
    // GLOBALS
    // -------------------------------------------------------------------
    let camera, scene, renderer, raycaster;
    let controller1, controller2;
    let controllerGrip1, controllerGrip2;
    let cameraRig;

    const loader   = new GLTFLoader();
    const pieces   = [];
    let piecesPlaced = 0;

    // WASD keys
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup',   e => keys[e.key.toLowerCase()] = false);

    const SNAP_DISTANCE = 0.4;

    // 6 piece files
    const PIECE_FILES = [
        'Assets/Models/Tablet/piece1.glb',
        'Assets/Models/Tablet/piece2.glb',
        'Assets/Models/Tablet/piece3.glb',
        'Assets/Models/Tablet/piece4.glb',
        'Assets/Models/Tablet/piece5.glb',
        'Assets/Models/Tablet/piece6.glb',
    ];

    // Where each piece snaps to on the wall frame
    // Arranged in a 2x3 grid centered at (0, 1.4, -4.9)
    const SNAP_POSITIONS = [
        new THREE.Vector3(-0.22, 1.75, -4.9),
        new THREE.Vector3( 0.22, 1.75, -4.9),
        new THREE.Vector3(-0.22, 1.40, -4.9),
        new THREE.Vector3( 0.22, 1.40, -4.9),
        new THREE.Vector3(-0.22, 1.05, -4.9),
        new THREE.Vector3( 0.22, 1.05, -4.9),
    ];

    // Pieces start on the table
    // Table is at Z = -2, top surface at Y = 0.92
    const START_POSITIONS = [
        new THREE.Vector3(-0.35, 0.95, -1.7),
        new THREE.Vector3( 0.05, 0.95, -1.7),
        new THREE.Vector3(-0.35, 0.95, -2.1),
        new THREE.Vector3( 0.05, 0.95, -2.1),
        new THREE.Vector3(-0.35, 0.95, -2.5),
        new THREE.Vector3( 0.05, 0.95, -2.5),
    ];

    init();

    // -------------------------------------------------------------------
    // INIT
    // -------------------------------------------------------------------
    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x110800);
        scene.fog = new THREE.Fog(0x110800, 8, 20);

        // Camera rig — player starts at Z=1 facing forward (-Z)
        cameraRig = new THREE.Group();
        cameraRig.position.set(0, 0, 1);
        scene.add(cameraRig);

        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(0, 1.6, 0);
        cameraRig.add(camera);

        // Lighting
        scene.add(new THREE.AmbientLight(0x3D1F00, 0.6));
        spawnTorch(-1.8, 2.0,  0.0);
        spawnTorch( 1.8, 2.0,  0.0);
        spawnTorch(-1.8, 2.0, -3.0);
        spawnTorch( 1.8, 2.0, -3.0);

        buildRoom();
        buildTable();
        buildTabletFrame();
        loadAllPieces();

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setAnimationLoop(animate);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // Controllers
        raycaster = new THREE.Raycaster();

        controller1 = renderer.xr.getController(0);
        controller1.addEventListener('selectstart', onSelectStart);
        controller1.addEventListener('selectend',   onSelectEnd);
        cameraRig.add(controller1);

        controller2 = renderer.xr.getController(1);
        controller2.addEventListener('selectstart', onSelectStart);
        controller2.addEventListener('selectend',   onSelectEnd);
        cameraRig.add(controller2);

        const factory = new XRControllerModelFactory();
        controllerGrip1 = renderer.xr.getControllerGrip(0);
        controllerGrip1.add(factory.createControllerModel(controllerGrip1));
        cameraRig.add(controllerGrip1);

        controllerGrip2 = renderer.xr.getControllerGrip(1);
        controllerGrip2.add(factory.createControllerModel(controllerGrip2));
        cameraRig.add(controllerGrip2);

        // Laser lines
        const lineGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, -1)
        ]);
        const line = new THREE.Line(lineGeo);
        line.name = 'line';
        line.scale.z = 5;
        controller1.add(line.clone());
        controller2.add(line.clone());

        window.addEventListener('resize', onWindowResize);
    }

    // -------------------------------------------------------------------
    // ROOM
    // -------------------------------------------------------------------
    function buildRoom() {
        const stone = new THREE.MeshStandardMaterial({ color: 0x6B3A1F, roughness: 1.0 });
        const dark  = new THREE.MeshStandardMaterial({ color: 0x2A1208, roughness: 1.0 });

        // Floor
        addBox(0, -0.1, -3,  6, 0.2, 12, dark);
        // Ceiling
        addBox(0,  3.6, -3,  6, 0.2, 12, dark);
        // Left wall
        addBox(-3, 1.75, -3, 0.2, 3.7, 12, stone);
        // Right wall
        addBox( 3, 1.75, -3, 0.2, 3.7, 12, stone);
        // Back wall (behind player)
        addBox(0, 1.75,  2,  6, 3.7, 0.2, stone);
        // Front wall (where tablet frame goes)
        addBox(0, 1.75, -5,  6, 3.7, 0.2, stone);
    }

    // -------------------------------------------------------------------
    // TABLE — stone table holding the pieces
    // -------------------------------------------------------------------
    function buildTable() {
        const top = new THREE.MeshStandardMaterial({ color: 0x7A5C3A, roughness: 0.8 });
        const leg = new THREE.MeshStandardMaterial({ color: 0x5C3D1E, roughness: 1.0 });

        // Table top — wide enough for 2 columns of pieces
        addBox(-0.15, 0.9, -2.1,  1.0, 0.08, 1.2, top);

        // 4 legs
        addBox(-0.55, 0.45, -1.6,  0.08, 0.9, 0.08, leg);
        addBox( 0.25, 0.45, -1.6,  0.08, 0.9, 0.08, leg);
        addBox(-0.55, 0.45, -2.6,  0.08, 0.9, 0.08, leg);
        addBox( 0.25, 0.45, -2.6,  0.08, 0.9, 0.08, leg);
    }

    // -------------------------------------------------------------------
    // TABLET FRAME — glowing outline on the wall
    // -------------------------------------------------------------------
    function buildTabletFrame() {
        // Glowing frame outline
        const frameMat = new THREE.MeshStandardMaterial({
            color: 0xFFD700,
            emissive: new THREE.Color(0xFFAA00),
            emissiveIntensity: 0.6,
            transparent: true,
            opacity: 0.35,
        });

        // Full frame background
        const frame = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.85, 0.02), frameMat);
        frame.position.set(0, 1.4, -4.88);
        scene.add(frame);

        // Glow light behind frame
        const glow = new THREE.PointLight(0xFFAA00, 1.0, 3);
        glow.position.set(0, 1.4, -4.7);
        scene.add(glow);

        // Individual slot outlines
        SNAP_POSITIONS.forEach((pos) => {
            const slotMat = new THREE.MeshStandardMaterial({
                color: 0xFFD700,
                emissive: new THREE.Color(0xFFCC00),
                emissiveIntensity: 0.3,
                transparent: true,
                opacity: 0.2,
                wireframe: true
            });
            const slot = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.28, 0.01), slotMat);
            slot.position.copy(pos);
            slot.position.z = -4.88;
            scene.add(slot);
        });
    }

    // -------------------------------------------------------------------
    // LOAD ALL PIECES
    // -------------------------------------------------------------------
    function loadAllPieces() {
        PIECE_FILES.forEach((file, index) => {
            loader.load(file, (gltf) => {
                const piece = gltf.scene;

                // Scale down — pieces are very large in Blender units
                piece.scale.set(0.06, 0.06, 0.06);

                // Position on table
                piece.position.copy(START_POSITIONS[index]);

                // Slight random tilt so they look naturally placed
                piece.rotation.y = (Math.random() - 0.5) * 0.4;

                // Tag for interaction
                piece.userData.isPiece  = true;
                piece.userData.index    = index;
                piece.userData.snapped  = false;

                scene.add(piece);
                pieces.push(piece);
                console.log(`✅ Piece ${index + 1} loaded`);
            }, undefined, (err) => {
                console.error(`❌ Failed to load piece ${index + 1}:`, err);
            });
        });
    }

    // -------------------------------------------------------------------
    // GET PARENT PIECE from a mesh hit
    // -------------------------------------------------------------------
    function getParentPiece(obj) {
        while (obj) {
            if (obj.userData.isPiece) return obj;
            obj = obj.parent;
        }
        return null;
    }

    // -------------------------------------------------------------------
    // CONTROLLER EVENTS
    // -------------------------------------------------------------------
    function onSelectStart(event) {
        const controller = event.target;
        raycaster.setFromXRController(controller);

        // Collect all meshes from unsnapped pieces
        const meshes = [];
        pieces.forEach(p => {
            if (!p.userData.snapped) {
                p.traverse(c => { if (c.isMesh) meshes.push(c); });
            }
        });

        const hits = raycaster.intersectObjects(meshes, true);
        if (hits.length > 0) {
            const piece = getParentPiece(hits[0].object);
            if (piece && !piece.userData.snapped) {
                // Highlight blue while held
                piece.traverse(c => {
                    if (c.isMesh) {
                        c.userData.origEmissive = c.material.emissive?.clone();
                        c.material = c.material.clone();
                        c.material.emissive = new THREE.Color(0x002288);
                        c.material.emissiveIntensity = 0.6;
                    }
                });
                controller.attach(piece);
                controller.userData.held = piece;
            }
        }
    }

    function onSelectEnd(event) {
        const controller = event.target;
        const piece = controller.userData.held;
        if (!piece) return;

        scene.attach(piece);
        controller.userData.held = undefined;

        // Remove blue highlight
        piece.traverse(c => {
            if (c.isMesh) c.material.emissiveIntensity = 0;
        });

        // Try to snap
        trySnap(piece);
    }

    // -------------------------------------------------------------------
    // SNAP LOGIC
    // -------------------------------------------------------------------
    function trySnap(piece) {
        const worldPos = new THREE.Vector3();
        piece.getWorldPosition(worldPos);

        const target = SNAP_POSITIONS[piece.userData.index];
        const dist   = worldPos.distanceTo(target);

        if (dist < SNAP_DISTANCE) {
            // Snap into place
            piece.position.copy(target);
            piece.rotation.set(0, 0, 0);
            piece.userData.snapped = true;

            // Gold flash
            piece.traverse(c => {
                if (c.isMesh) {
                    c.material = c.material.clone();
                    c.material.emissive = new THREE.Color(0xFFAA00);
                    c.material.emissiveIntensity = 1.0;
                }
            });
            setTimeout(() => {
                piece.traverse(c => {
                    if (c.isMesh) c.material.emissiveIntensity = 0.15;
                });
            }, 800);

            piecesPlaced++;
            document.getElementById('progress').textContent = `${piecesPlaced} / 6 pieces placed`;

            if (piecesPlaced >= 6) puzzleSolved();
        }
    }

    // -------------------------------------------------------------------
    // PUZZLE SOLVED
    // -------------------------------------------------------------------
    function puzzleSolved() {
        document.getElementById('ui').innerHTML = `
            <span style="font-size:26px;">✨ The Tablet is Restored! ✨</span><br>
            <span style="font-size:15px; color:#FFA500;">The next chamber awakens...</span>
        `;
        // Big gold burst
        const burst = new THREE.PointLight(0xFFD700, 8, 10);
        burst.position.set(0, 1.4, -4.7);
        scene.add(burst);
        setTimeout(() => scene.remove(burst), 2000);
    }

    // -------------------------------------------------------------------
    // HOVER
    // -------------------------------------------------------------------
    function updateHover() {
        [controller1, controller2].forEach(ctrl => {
            if (ctrl.userData.held) return;
            raycaster.setFromXRController(ctrl);

            const meshes = [];
            pieces.forEach(p => {
                if (!p.userData.snapped) {
                    p.traverse(c => { if (c.isMesh) meshes.push(c); });
                }
            });

            const hits = raycaster.intersectObjects(meshes, true);
            const line = ctrl.getObjectByName('line');
            if (hits.length > 0) {
                if (line) line.scale.z = hits[0].distance;
            } else {
                if (line) line.scale.z = 5;
            }
        });
    }

    // -------------------------------------------------------------------
    // TORCH
    // -------------------------------------------------------------------
    function spawnTorch(x, y, z) {
        const mat = new THREE.MeshStandardMaterial({ color: 0x4A2800 });
        const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4, 6), mat);
        handle.position.set(x, y, z);
        scene.add(handle);

        const flameMat = new THREE.MeshStandardMaterial({
            color: 0xFF6600,
            emissive: new THREE.Color(0xFF4400),
            emissiveIntensity: 1.0
        });
        const flame = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), flameMat);
        flame.position.set(x, y + 0.25, z);
        scene.add(flame);

        const light = new THREE.PointLight(0xff5500, 1.8, 7);
        light.position.set(x, y + 0.3, z);
        scene.add(light);
    }

    // -------------------------------------------------------------------
    // HELPERS
    // -------------------------------------------------------------------
    function addBox(x, y, z, w, h, d, mat) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.position.set(x, y, z);
        scene.add(mesh);
        return mesh;
    }

    function handleKeyboard() {
        const delta = 1 / 60;
        const speed = 3.0;
        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0; forward.normalize();
        const right = new THREE.Vector3();
        right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

        if (keys['w'] || keys['arrowup'])    cameraRig.position.addScaledVector(forward,  speed * delta);
        if (keys['s'] || keys['arrowdown'])  cameraRig.position.addScaledVector(forward, -speed * delta);
        if (keys['a'] || keys['arrowleft'])  cameraRig.position.addScaledVector(right,   -speed * delta);
        if (keys['d'] || keys['arrowright']) cameraRig.position.addScaledVector(right,    speed * delta);
        if (keys['q']) cameraRig.rotation.y += 0.02;
        if (keys['e']) cameraRig.rotation.y -= 0.02;
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        handleKeyboard();
        updateHover();
        renderer.render(scene, camera);
    }

</script>
</body>
</html>
