        // STATION 1 — SCROLL PUZZLE (left platform at -5, 0, -17)
        // Drag 4 papyrus pieces onto the table to assemble the clue
        // -------------------------------------------------------------------
        function buildStation1() {

            // Stone table
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x7A6A50, roughness: 0.9 });
            const legMat   = new THREE.MeshStandardMaterial({ color: 0x6A5A40, roughness: 1.0 });

            const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.7), tableMat);
            tableTop.position.set(-5, 0.84, -17);
            scene.add(tableTop);

            [[-0.5,-0.28],[-0.5,0.28],[0.5,-0.28],[0.5,0.28]].forEach(([x,z]) => {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.84, 0.1), legMat);
                leg.position.set(-5 + x, 0.42, -17 + z);
                scene.add(leg);
            });

            // Label above table
            makeTextPanel('STATION 1\nAssemble the scroll', -5, 1.8, -17, 0.8, 0.35);

            // 4 papyrus scroll pieces scattered on the table
            const colors = [0xD4A96A, 0xC8985E, 0xDDB87A, 0xBF8A50];
            colors.forEach((color, i) => {
                const geo = new THREE.PlaneGeometry(0.26, 0.18);
                const mat = new THREE.MeshStandardMaterial({
                    color, roughness: 0.9, side: THREE.DoubleSide
                });
                const piece = new THREE.Mesh(geo, mat);

                // Scatter randomly on table surface
                piece.position.set(
                    -5 + (Math.random() - 0.5) * 0.8,
                    0.90,
                    -17 + (Math.random() - 0.5) * 0.4
                );
                piece.rotation.x = -Math.PI / 2;
                piece.rotation.z = (Math.random() - 0.5) * 1.0;
                piece.name = `piece_${i}`;
                piece.userData.type = 'scrollPiece';

                // Draw hieroglyph markings on each piece
                const canvas = document.createElement('canvas');
                canvas.width = 128; canvas.height = 82;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = ['#D4A96A','#C8985E','#DDB87A','#BF8A50'][i];
                ctx.fillRect(0, 0, 128, 82);
                ctx.fillStyle = '#4a2a0a';
                ctx.font = '16px serif';
                const syms = ['𓂀','𓆣','𓅓','𓁹','𓊪','𓏌'];
                for (let r = 0; r < 3; r++)
                    for (let c = 0; c < 4; c++)
                        ctx.fillText(syms[(r+c+i)%syms.length], 8+c*30, 20+r*25);
                // Mark which quadrant this piece represents
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 3;
                ctx.strokeRect(2, 2, 124, 78);

                mat.map = new THREE.CanvasTexture(canvas);
                mat.needsUpdate = true;

                scene.add(piece);
                scrollPieces.push(piece);
                grabbableObjects.push(piece);
            });

            // Torch lighting for station 1
            spawnTorch(scene, -6.5, 2, -15);
            spawnTorch(scene, -3.5, 2, -15);
        }

        // -------------------------------------------------------------------
        // SMOOTH LOCOMOTION
        // Left stick = move, Right stick = snap rotate 45°
        // -------------------------------------------------------------------
        function handleLocomotion() {
            const session = renderer.xr.getSession();
            if (!session) return;

            const delta = 1 / 72;

            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                const axes = source.gamepad.axes;

                if (source.handedness === 'left') {
                    const moveX = axes[2] ?? 0;
                    const moveZ = axes[3] ?? 0;

                    if (Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1) {
                        const forward = new THREE.Vector3();
                        camera.getWorldDirection(forward);
                        forward.y = 0;
                        forward.normalize();

                        const right = new THREE.Vector3();
                        right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

                        cameraRig.position.addScaledVector(forward, -moveZ * moveSpeed * delta);
                        cameraRig.position.addScaledVector(right,    moveX * moveSpeed * delta);
                    }
                }

                if (source.handedness === 'right') {
                    const rotX = axes[2] ?? 0;

                    if (rotX > 0.7 && canSnapRight) {
                        cameraRig.rotation.y -= snapAngle;
                        canSnapRight = false;
                    } else if (rotX < -0.7 && canSnapLeft) {
                        cameraRig.rotation.y += snapAngle;
                        canSnapLeft = false;
                    }
                    if (Math.abs(rotX) < 0.3) {
                        canSnapLeft = true;
                        canSnapRight = true;
                    }
                }
            }
        }
