<!DOCTYPE html>
<html lang="en">

<head>
    <title>VR Pyramid Tomb Escape</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background-color: #110800; }
    </style>
</head>

<body>
    <audio id="bladeSound" src="Assets/audio/blade.mp3"></audio>
    <audio id="screamSound" src="Assets/audio/scream.mp3"></audio>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { initPuzzle1, puzzle1TryGrab, puzzle1TryRelease, puzzle1UpdateHover } from './puzzle1.js';
        import { initTreasureChest } from './puzzle3.js';
import { initPuzzle2, puzzle2TryGrab, puzzle2TryRelease, puzzle2UpdateHover, puzzle2UpdateBeam, puzzle2RegisterRefs } from './puzzle2.js';
        // -------------------------------------------------------------------
        // GLOBALS
        // -------------------------------------------------------------------
        let camera, scene, renderer, raycaster;
        let controller1, controller2;
        let controllerGrip1, controllerGrip2;
        let cameraRig;
        const moveSpeed = 2.0;
        const snapAngle = Math.PI / 4;
        let canSnapLeft = true;
        let canSnapRight = true;

        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup',   e => keys[e.key.toLowerCase()] = false);

        // ── KEYBOARD TEST SHORTCUTS — for debugging without VR controllers ──
        // Press these keys anywhere to skip steps in the puzzle
        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (k === '1') {
                // Force-unlock the chest immediately
                const chest = grabbableObjects.find(g => g.userData?.dials);
                console.log('TEST: force unlock chest');
                // Walk grabbableObjects looking for any chest dial → its parent is chest
                for (const o of grabbableObjects) {
                    if (o.userData?.type === 'dial' && o.parent?.userData?.dials) {
                        const ch = o.parent;
                        ch.userData.dials.forEach((d, i) => {
                            d.userData.value = [4, 2, 3][i];
                            ch.userData.updateDial(d);
                        });
                        updateChestStatus(ch);
                        break;
                    }
                }
            }
            if (k === '2') {
                // Force-grab the chest key (attaches to camera)
                console.log('TEST: force grab key');
                scene.traverse(obj => {
                    if (obj.userData?.type === 'chestKey') {
                        camera.attach(obj);
                        obj.position.set(0.3, -0.3, -0.6);
                        obj.scale.setScalar(1);
                        obj.userData.grabbed = true;
                        obj.visible = true;
                        scene.userData.keyObtained = true;
                    }
                });
            }
            if (k === '3') {
                // Force-insert key into keyhole stand
                console.log('TEST: force insert key');
                if (!scene.userData.keyInserted && scene.userData.keyObtained) {
                    insertKeyIntoStand();
                } else if (!scene.userData.keyObtained) {
                    console.log('Need to grab the key first (press 2)');
                }
            }
            if (k === '4') {
                // Force-pull the lever (only works after lever has risen)
                console.log('TEST: force pull lever');
                scene.userData.leverPulled = true;
                scene.userData.leverT = 0;
            }
            if (k === '5') {
                // Teleport outside the door to test the escaped sign
                console.log('TEST: teleport outside');
                scene.userData.leverPulled = true;
                scene.userData.doorOpen = true;
                scene.userData.doorT = 1;
                if (scene.userData.doorSlab) {
                    scene.userData.doorSlab.position.y = scene.userData.doorSlab.userData.closedY + 4;
                }
                cameraRig.position.set(0, 0, 10);
            }
        });

        let gamePhase = 'tomb';
        window.addEventListener('puzzle1Solved', () => {
            station1Solved = true; window._station1Solved = true;
            const d = scene.getObjectByName('station2Dark');
            if (d) scene.remove(d);
            const l = scene.getObjectByName('station2Light');
            if (l) l.intensity = 4.5;
        });
        window.addEventListener('puzzle2Solved', () => {
            station2Solved = true; window._station2Solved = true;
            const d = scene.getObjectByName('station3Dark');
            if (d) scene.remove(d);
            const l = scene.getObjectByName('station3Light');
            if (l) l.intensity = 4.5;
        });
        let grabbableObjects = [];
        const intersected = [];

        // Puzzle state
        let station1Solved = false;
        let station2Solved = false;
        let station3Solved = false;

        // Station 2 scale state
        let leftPanMass  = 1.0; 
        let rightPanMass = 0.0; 
        let scalePanLeft  = null;
        let scalePanRight = null;
        let scaleBeamMesh = null;
        const scaleObjects = []; 

        // Station 3 glyph counter state
        const ANSWER = { sun: 4, star: 6, snake: 3 };
        const playerInput = { sun: 0, star: 0, snake: 0 };
        let station3Frame = null;
        const counterButtons = []; 

        // Station 1 scroll state
        const scrollPieces = [];
        const scrollSolved = new Set();
        const scrollSnapTargets = {
            piece_0: new THREE.Vector3(-6.25, 0.22, -11.75),
            piece_1: new THREE.Vector3(-5.85, 0.22, -11.75),
            piece_2: new THREE.Vector3(-6.25, 0.22, -12.25),
            piece_3: new THREE.Vector3(-5.85, 0.22, -12.25),
        };

        // Lever state
        let leverArm = null;
        let leverActive = false;
        let leverPulled = false;
        let gameOverTriggered = false;
        const leverObjects = [];

        // Torch model
        let torchTemplate = null;
        const pendingTorchPlacements = [];
        
        // All torch point lights — animated each frame for flicker
        const torchLights = [];
        const loader = new GLTFLoader();

        // Hourglass & Timer State
        let hourglassGroup; // This will be attached to the camera
        let hourglassSandTop, hourglassSandBottom;
        let timeRemaining = 5; // 10 minutes
        let timerPaused = true;  // start paused — user clicks play to begin
        let lastTimestamp = 0;
        let timerTextPanel = null;

        loader.load('Assets/Models/torch/scene.gltf', (gltf) => {
            torchTemplate = gltf.scene;
            torchTemplate.scale.set(0.5, 0.5, 0.5);
            torchTemplate.traverse((child) => {
                if (!child.isMesh) return;
                if (child.material.name.toLowerCase() === 'flames') {
                    child.visible = false;
                } else {
                    child.material.emissiveIntensity = 0.05;
                }
            });
            pendingTorchPlacements.forEach(p => placeTorch(p.parent, p.x, p.y, p.z, p.lightIntensity));
            pendingTorchPlacements.length = 0;
        }, undefined, (err) => console.error('Torch failed:', err));

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0A0402); // changed to sky color when outside
            
            // Moderate fog — room stays visible but far end fades naturally
            

            // Background music — starts on first user interaction (browsers block autoplay)
            const bgMusic = document.getElementById('bgMusic');
            if (bgMusic) {
                bgMusic.volume = 0.3; // 30% volume — change to adjust loudness (0.0 to 1.0)
                const startMusic = () => bgMusic.play().catch(() => {});
                document.addEventListener('click', startMusic, { once: true });
                document.addEventListener('keydown', startMusic, { once: true });
                // VR session also counts as interaction
                if (window.addEventListener) {
                    window.addEventListener('touchstart', startMusic, { once: true });
                }
            }

            cameraRig = new THREE.Group();
            cameraRig.position.set(0, 0, -10); 
            scene.add(cameraRig);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 80);
            camera.position.set(0, 1.6, 0);
            cameraRig.add(camera);

            // Warm ambient — enough to see stone surfaces clearly, torches add drama
            scene.add(new THREE.AmbientLight(0x6B3010, 2.0)); 

            // Hemisphere: warm firelight from below bouncing off stone floor, cool dark above
            const hemi = new THREE.HemisphereLight(0x7A3208, 0x080200, 1.4);
            scene.add(hemi);
            buildScarabPedestal();
            buildCorridor();
            buildTombRoom();
            buildStation1();
            buildStation2();
            buildStation3();
            buildStation4(); 
            buildLever();
            buildWallPaintings();
            buildEgyptExit();
            initPuzzle1(scene, camera, renderer);
            initPuzzle2(scene, camera, renderer);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setAnimationLoop(animate);
            renderer.xr.enabled = true;
            renderer.shadowMap.enabled = true;
            
            // Enhanced shadows for contrast
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            document.body.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));

            raycaster = new THREE.Raycaster();

            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onSelectStart);
            controller1.addEventListener('selectend', onSelectEnd);
            cameraRig.add(controller1);

            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', onSelectStart);
            controller2.addEventListener('selectend', onSelectEnd);
            cameraRig.add(controller2);

            const factory = new XRControllerModelFactory();
            controllerGrip1 = renderer.xr.getControllerGrip(0);
            controllerGrip1.add(factory.createControllerModel(controllerGrip1));
            cameraRig.add(controllerGrip1);

            controllerGrip2 = renderer.xr.getControllerGrip(1);
            controllerGrip2.add(factory.createControllerModel(controllerGrip2));
            cameraRig.add(controllerGrip2);

            const lineGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -1)
            ]);
            const line = new THREE.Line(lineGeo);
            line.name = 'line';
            line.scale.z = 5;
            controller1.add(line.clone());
            controller2.add(line.clone());

            // ── Build hourglass HUD (attaches to camera so it follows player view) ──
            buildHourglass();

            // Desktop mouse click — triggers lever when clicked
            renderer.domElement.addEventListener('click', (e) => {
                if (renderer.xr.isPresenting) return; // only in non-VR mode
                const mouse = new THREE.Vector2(
                    (e.clientX / window.innerWidth) * 2 - 1,
                    -(e.clientY / window.innerHeight) * 2 + 1
                );
                const rc = new THREE.Raycaster();
                rc.setFromCamera(mouse, camera);
                const hits = rc.intersectObjects(grabbableObjects, true);
                for (const h of hits) {
                    let o = h.object;
                    while (o && !o.userData.type) o = o.parent;
                    if (!o) continue;
                    if (o.userData.type === 'scarabBall') {
                        timerPaused = false;
                        scene.remove(o);
                        grabbableObjects.splice(grabbableObjects.indexOf(o), 1);
                        console.log('Timer started!');
                        return;
                    }
                    if (o.userData.type === 'lever') {
                        scene.userData.leverPulled = true;
                        scene.userData.leverT = 0;
                        console.log('Lever pulled via mouse click!');
                        return;
                    }
                   if (o.userData.type === 'dial') {
                        if (!station2Solved) { showLockMessage('Balance the Scales first!'); return; }
                        const chest = o.parent;
                        if (chest && chest.userData.updateDial && !chest.userData.isUnlocked()) {
                            o.userData.value = (o.userData.value + 1) % 10;
                            chest.userData.updateDial(o);
                            updateChestStatus(chest);
                        }
                        return;
                    }
                    if (o.userData.type === 'chestKey' && o.userData.grabbable && !o.userData.grabbed) {
                        // Desktop: grab key by attaching to camera (carry it as you walk)
                        camera.attach(o);
                        o.position.set(0.3, -0.3, -0.6);
                        o.userData.grabbed = true;
                        scene.userData.keyObtained = true;
                        console.log('🗝 Chest key obtained (desktop)!');
                        return;
                    }
                    // ── KEYHOLE STAND insertion — only works if player has the key ──
                    if (o.userData.type === 'keyholeStand' && scene.userData.keyObtained && !scene.userData.keyInserted) {
                        insertKeyIntoStand();
                        return;
                    }
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        // Triggered when player clicks the keyhole stand while holding the key
        function insertKeyIntoStand() {
            scene.userData.keyInserted = true;
            console.log('🗝 Key inserted into stand! Lever rising...');

            // 1. Hide the key from the player (it's "consumed" into the stand)
            //    Find any object in the scene with userData.type === 'chestKey' and hide it
            scene.traverse(obj => {
                if (obj.userData && obj.userData.type === 'chestKey') {
                    obj.visible = false;
                }
            });

            // 2. Change keyhole indicator from red to green
            if (scene.userData.keyholeIndicator) {
                scene.userData.keyholeIndicator.color.setHex(0x30FF30);
                scene.userData.keyholeIndicator.intensity = 4.0;
            }

            // 3. Trigger lever rising animation
            scene.userData.leverRising = true;
            scene.userData.leverRiseT = 0;
        }

        // Big "YOU ESCAPED!" banner that takes over the screen briefly when player walks out
        function showEscapedSign() {
            const sign = document.createElement('div');
            sign.id = 'escapedSign';
            sign.style.cssText = `
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                z-index: 2000;
                display: flex; align-items: center; justify-content: center;
                background: radial-gradient(ellipse at center, rgba(255,215,0,0.25) 0%, rgba(0,0,0,0) 70%);
                pointer-events: none;
                animation: escapedFadeIn 1s ease-out forwards;
            `;
            sign.innerHTML = `
                <style>
                    @keyframes escapedFadeIn {
                        0% { opacity: 0; transform: scale(0.7); }
                        100% { opacity: 1; transform: scale(1); }
                    }
                    @keyframes escapedGlow {
                        0%, 100% { text-shadow: 0 0 20px #FFD700, 0 0 40px #B8860B, 0 0 60px #000; }
                        50% { text-shadow: 0 0 30px #FFD700, 0 0 60px #B8860B, 0 0 90px #000; }
                    }
                </style>
                <div style="text-align: center;">
                    <div style="
                        font-family: 'Times New Roman', serif;
                        font-size: 120px;
                        font-weight: bold;
                        color: #8B4513;
                        -webkit-text-stroke: 3px #2A1500;
                        letter-spacing: 12px;
                        animation: escapedGlow 2s ease-in-out infinite;
                        margin-bottom: 16px;
                    ">YOU ESCAPED!</div>
                    <div style="
                        font-family: serif;
                        font-size: 32px;
                        color: #FFE680;
                        text-shadow: 2px 2px 6px #000, 0 0 12px #4A2A00;
                        letter-spacing: 4px;
                    ">★ The Pharaoh's Tomb is conquered ★</div>
                </div>
            `;
            document.body.appendChild(sign);
            // Stop the timer
            timeRemaining = 0;
            console.log('🏆 YOU ESCAPED!');
        }

function buildScarabPedestal() {
            var pedMat = new THREE.MeshStandardMaterial({ color: 0x8B6914, roughness: 0.8 });
            var ped = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.0, 0.3), pedMat);
            ped.position.set(0, 0.5, -13);
            scene.add(ped);

            var plateMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.9, roughness: 0.2 });
            var plate = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.05, 0.4), plateMat);
            plate.position.set(0, 1.05, -13);
            scene.add(plate);

            var ballMat = new THREE.MeshStandardMaterial({
                color: 0xFFD700, metalness: 0.95, roughness: 0.1,
                emissive: new THREE.Color(0xFFAA00), emissiveIntensity: 0.5,
            });
            var ball = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), ballMat);
            ball.position.set(0, 1.25, -13);
            ball.name = 'scarabBall';
            ball.userData.type = 'scarabBall';
            scene.add(ball);
            grabbableObjects.push(ball);

            var glow = new THREE.PointLight(0xFFD700, 2, 3);
            glow.position.set(0, 1.8, -13);
            scene.add(glow);
        }

        function buildCorridor() {
            // Match tomb room materials exactly
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x3D2515, roughness: 0.95 });
            const wallMat  = new THREE.MeshStandardMaterial({ color: 0x080400, roughness: 1.0, metalness: 0 });
            const ceilMat  = new THREE.MeshStandardMaterial({ color: 0x150A04, roughness: 1.0  });

            // Corridor box: z range [-9 to +7], width 4 (x: -2 to +2), height 3.5
            addBox(0, -0.1, -1, 4, 0.2, 16, floorMat);      // floor — same as tomb
            addBox(0,  3.6, -1, 4, 0.2, 16, ceilMat);       // ceiling — same as tomb
            // Side walls — same as tomb walls
            addBox(-2, 1.75, -1, 0.2, 3.5, 16, wallMat);
            addBox( 2, 1.75, -1, 0.2, 3.5, 16, wallMat);

            // Corridor ends at z=+7.5 — door at z=+6.2 seals it when closed
            // (no end-cap wall here; the door + stone panels in buildEgyptExit do the sealing)

            // Torches
            [
                { x: -1.8, z:  2 }, { x:  1.8, z:  2 },
                { x: -1.8, z: -1 }, { x:  1.8, z: -1 },
                { x: -1.8, z: -4 }, { x:  1.8, z: -4 },
            ].forEach(p => spawnTorch(scene, p.x, 2.0, p.z));
        }

        function buildTombRoom() {
            // Stone materials — warm brownish-red like the reference
            const floorMat   = new THREE.MeshStandardMaterial({ color: 0x080400, roughness: 1.0, metalness: 0 });  // match ceiling darkness
            const wallMat    = new THREE.MeshStandardMaterial({ color: 0x080400, roughness: 1.0, metalness: 0 });  // same as ceiling
            const ceilMat    = new THREE.MeshStandardMaterial({ color: 0x080400, roughness: 1.0, metalness: 0 });
            const backWallMat = new THREE.MeshStandardMaterial({ color: 0x080400, roughness: 1.0, metalness: 0 });  // same as ceiling
            const exteriorMat = new THREE.MeshStandardMaterial({ color: 0x8B6020, roughness: 1.0 }); // sandstone outside

            // ── Exterior: solid sandstone building that wraps both tomb and corridor ──
            // Use a SINGLE wide box shape so there are no gaps/edges between tomb and corridor.
            // We build exterior walls around the PERIMETER of the combined shape (tomb + corridor T).
            const extMat = new THREE.MeshStandardMaterial({ color: 0xC89040, roughness: 1.0 });

            // Tomb outline: x[-9, 9], z[-27, -9]  (the wider back block)
            // Corridor outline: x[-2, 2], z[-9, 7]  (narrow passage forward)
            // Common roof: use tomb height 5.6 everywhere for a uniform building height

            // === Unified exterior building (tomb + corridor T-shape) ===
            // Build as ONE continuous outer shell, all walls aligned perfectly to avoid edges.
            // Tomb: x[-9.2, 9.2], z[-27.2, -9]
            // Corridor: x[-2.2, 2.2], z[-9, 7.1]
            // Where corridor meets tomb (at z=-9), the corridor walls must EXTEND INTO the tomb
            // wall plane so there's no gap, and tomb's front wall ENDS exactly at corridor edges.

            const EXT_H = 5.6;        // exterior height
            const EXT_YC = EXT_H/2;    // y centre = 2.8
            const WT = 0.8;            // wall thickness — thicker so there are NO gaps

            // === Tomb exterior: x[-9.2, 9.2], z[-9, -27.2] ===
            // Interior side walls span z=-7 to z=-27. Exterior must cover FULL span.
            // Left wall — z from -7 to -27.6 (length 20.6, centred at -17.3)
            addBox(-9.6, EXT_YC, -17.3, WT, EXT_H, 20.6, extMat);
            // Right wall
            addBox( 9.6, EXT_YC, -17.3, WT, EXT_H, 20.6, extMat);
            // Back wall
            addBox( 0,   EXT_YC, -27.6, 20, EXT_H, WT, extMat);
            // Front wall left of corridor opening (corridor is 4 wide centred on x=0)
            // Interior doorway wall spans x=-9 to x=-1.5 on the left. Exterior must cover that.
            // Corridor exterior is at x=±2.6 thickness 0.8. So exterior front wall should go
            // from x=-9.6 (meets tomb left wall) to x=-2.2 (meets corridor left wall edge).
            // Width = 7.4, centred at x=-5.9
            addBox(-5.9, EXT_YC, -9.4, 7.4, EXT_H, WT, extMat);
            addBox( 5.9, EXT_YC, -9.4, 7.4, EXT_H, WT, extMat);

            // === Corridor exterior: x[-2.2, 2.2], z[-9, 7.1] ===
            // Corridor left wall — spans z from -9.4 (into tomb front) to +7.5 (past door)
            // Length = 16.9, centred at z=-0.95
            addBox(-2.6, EXT_YC, -0.95, WT, EXT_H, 16.9, extMat);
            addBox( 2.6, EXT_YC, -0.95, WT, EXT_H, 16.9, extMat);
            // Front wall — left/right of door opening, and above
            addBox(-1.825, EXT_YC, 7.5, 0.75, EXT_H, WT, extMat);
            addBox( 1.825, EXT_YC, 7.5, 0.75, EXT_H, WT, extMat);
            addBox( 0, 4.7, 7.5, 2.9, 1.8, WT, extMat);

            // === Roof — one big slab that covers the entire T-shape ===
            // Tomb roof
            addBox( 0, EXT_H + 0.4, -17.3, 20, 0.8, 20.6, extMat);
            // Corridor roof
            addBox( 0, EXT_H + 0.4, -0.95, 5.4, 0.8, 16.9, extMat);

            // Floor
            addBox( 0, -0.1, -17, 18, 0.2, 20, floorMat);
            // Ceiling
            addBox( 0,  5.2, -17, 18, 0.3, 20, ceilMat);

            // ── PUZZLE 3 SYMBOLS ON CEILING ──
            // Place 4 suns, 2 scarabs, and 3 ankhs across the ceiling for the player to count
            // (these counts must match SECRET_CODE = [4, 2, 3] in puzzle3.js)
            buildCeilingSymbols();

            // Back wall — emissive orange centre glow
            const backWall = new THREE.Mesh(new THREE.BoxGeometry(18, 5.6, 0.3), backWallMat);
            backWall.position.set(0, 2.6, -27);
            backWall.receiveShadow = true;
            scene.add(backWall);

            // Side walls
            addBox(-9, 2.6, -17, 0.3, 5.6, 20, wallMat);
            addBox( 9, 2.6, -17, 0.3, 5.6, 20, wallMat);

            // Doorway wall — extends fully from side wall to side wall
            // Side walls at x=±9. Opening is 3 wide centred on x=0 (from x=-1.5 to +1.5)
            // Left doorway wall: from x=-9 to x=-1.5, width 7.5, centred at x=-5.25
            addBox(-5.25, 2.6, -9, 7.5, 5.6, 0.3, wallMat);
            // Right doorway wall: from x=+1.5 to x=+9, width 7.5, centred at x=+5.25
            addBox( 5.25, 2.6, -9, 7.5, 5.6, 0.3, wallMat);
            // Lintel above doorway
            addBox(   0, 4.6, -9,   3, 1.5, 0.3, wallMat);

            // Floor tiles
            const groutMat = new THREE.MeshStandardMaterial({ color: 0x251508, roughness: 1.0 });
            for (let i = -4; i <= 4; i++) addBox(i * 2, 0.0, -17, 0.06, 0.015, 20, groutMat);
            for (let j = 0; j <= 9; j++) addBox(0, 0.0, -8 - j * 2.2, 18, 0.015, 0.06, groutMat);

            // === PILLARS ===
            // x: ±3.5 — close to centre aisle but won't clip camera at z:-10
            const PILLAR_X = 3.5;
            const PILLAR_Z  = [-16.0, -20.0, -24.0];  // removed -12 pillars (too close to entrance)

            // === PILLARS ===
            // Build geometry pillars IMMEDIATELY (always visible, no async dependency)

        // ── PUZZLE 3 CEILING SYMBOLS — place 4 suns, 2 scarabs, 7 ankhs on ceiling ──
        function buildCeilingSymbols() {
            // Drawing helpers — same procedural symbols as on the chest dial labels
            function drawSun(ctx, cx, cy, size, color) {
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.arc(cx, cy, size * 0.35, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = color; ctx.lineWidth = size * 0.07;
                for (let i = 0; i < 14; i++) {
                    const a = -Math.PI / 2 + (i - 7) * 0.18;
                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(a) * size * 0.4, cy + Math.sin(a) * size * 0.4);
                    ctx.lineTo(cx + Math.cos(a) * size * 0.95, cy + Math.sin(a) * size * 0.95);
                    ctx.stroke();
                }
            }
            function drawScarab(ctx, cx, cy, size, color) {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.ellipse(cx, cy, size * 0.45, size * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#3a1a02'; ctx.lineWidth = size * 0.05;
                ctx.beginPath(); ctx.moveTo(cx, cy - size * 0.5); ctx.lineTo(cx, cy + size * 0.5); ctx.stroke();
                for (let i = 1; i < 4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(cx - size * 0.4, cy - size * 0.4 + i * size * 0.25);
                    ctx.lineTo(cx + size * 0.4, cy - size * 0.4 + i * size * 0.25);
                    ctx.stroke();
                }
                ctx.lineWidth = size * 0.06;
                for (let i = -1; i <= 1; i += 2) {
                    ctx.beginPath(); ctx.moveTo(cx + i * size * 0.45, cy - size * 0.3);
                    ctx.lineTo(cx + i * size * 0.7, cy - size * 0.45); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(cx + i * size * 0.45, cy);
                    ctx.lineTo(cx + i * size * 0.75, cy); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(cx + i * size * 0.45, cy + size * 0.3);
                    ctx.lineTo(cx + i * size * 0.7, cy + size * 0.45); ctx.stroke();
                }
            }
            function drawAnkh(ctx, cx, cy, size, color) {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.ellipse(cx, cy - size * 0.45, size * 0.28, size * 0.35, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a0a02';
                ctx.beginPath();
                ctx.ellipse(cx, cy - size * 0.45, size * 0.16, size * 0.22, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = color;
                ctx.fillRect(cx - size * 0.45, cy - size * 0.10, size * 0.9, size * 0.16);
                ctx.fillRect(cx - size * 0.10, cy - size * 0.10, size * 0.20, size * 0.85);
            }

            // Make a symbol texture — transparent background so only the symbol shows
            // (No box around it — the ceiling shows behind it)
            function makeSymbolTexture(symbolType) {
                const c = document.createElement('canvas');
                c.width = 256; c.height = 256;
                const ctx = c.getContext('2d');
                // No background fill — keep canvas fully transparent
                if (symbolType === 'sun') drawSun(ctx, 128, 128, 110, '#FFD700');
                else if (symbolType === 'scarab') drawScarab(ctx, 128, 128, 105, '#FFD700');
                else if (symbolType === 'ankh') drawAnkh(ctx, 128, 128, 110, '#FFD700');
                return new THREE.CanvasTexture(c);
            }

            // Cache textures
            const sunTex = makeSymbolTexture('sun');
            const scarabTex = makeSymbolTexture('scarab');
            const ankhTex = makeSymbolTexture('ankh');

            // Place a symbol as a flat plane facing DOWN
            // Lower to y=4.6 so it's well away from the y=5.2 ceiling (no z-fight)
            // 1.4m wide so symbols are clearly visible from the floor
            function placeCeilingSymbol(tex, x, z) {
                const plane = new THREE.Mesh(
                    new THREE.PlaneGeometry(1.4, 1.4),
                    new THREE.MeshBasicMaterial({
                        map: tex,
                        transparent: true,
                        side: THREE.DoubleSide,
                        depthWrite: false,        // prevents the transparent plane from blocking objects behind it
                        alphaTest: 0.05           // crisp edges around the symbol
                    })
                );
                plane.position.set(x, 4.6, z);
                plane.rotation.x = Math.PI / 2; // face down toward player
                scene.add(plane);
            }

            // Place symbols away from the corridor entrance at z=-9.
            // All symbols must have z <= -13 so they're clearly away from the doors.

            // ─── 4 SUNS ───
            placeCeilingSymbol(sunTex, -6, -14);
            placeCeilingSymbol(sunTex,  6, -17);
            placeCeilingSymbol(sunTex, -6, -22);
            placeCeilingSymbol(sunTex,  6, -25);

            // ─── 2 SCARABS ───
            placeCeilingSymbol(scarabTex, 0, -16);
            placeCeilingSymbol(scarabTex, 0, -24);

            // ─── 3 ANKHS ───
            placeCeilingSymbol(ankhTex, -7, -19);
            placeCeilingSymbol(ankhTex,  7, -21);
            placeCeilingSymbol(ankhTex, -3, -26);
        }

                // Inner dark frame
                x.fillStyle = '#3a2010';
                x.fillRect(8, 8, 1008, 240);
                // Gold border
                x.strokeStyle = '#DAA520';
                x.lineWidth = 6;
                x.strokeRect(14, 14, 996, 228);
                // Inner thin border
                x.strokeStyle = '#8B6914';
                x.lineWidth = 2;
                x.strokeRect(24, 24, 976, 208);

                if (unlocked) {
                    x.fillStyle = '#80FF80';
                    x.font = 'bold 84px serif';
                    x.textAlign = 'center';
                    x.textBaseline = 'middle';
                    x.shadowColor = '#80FF80';
                    x.shadowBlur = 20;
                    x.fillText('★ UNLOCKED — GRAB THE KEY ★', 512, 128);
                } else {
                    x.fillStyle = '#FFD700';
                    x.font = 'bold 64px serif';
                    x.textAlign = 'center';
                    x.textBaseline = 'middle';
                    x.shadowColor = '#FFE680';
                    x.shadowBlur = 10;
                    // Three counts evenly spaced
                    x.fillText(`Sun: ${sunCount}`, 200, 128);
                    x.fillText(`Scarab: ${scarabCount}`, 512, 128);
                    x.fillText(`Ankh: ${ankhCount}`, 824, 128);
                }
                x.shadowBlur = 0;
                return new THREE.CanvasTexture(c);
            }

            const statusTex = makeStatusTexture(0, 0, 0, false);
            const statusPlaque = new THREE.Mesh(
                new THREE.PlaneGeometry(1.6, 0.4),
                new THREE.MeshBasicMaterial({ map: statusTex, transparent: true })
            );
            // Lay flat on the table top, in FRONT of the chest (chest is at z=-0.25, plaque at z=+0.5)
            statusPlaque.position.set(0, 1.04, 0.55);
            statusPlaque.rotation.x = -Math.PI / 2; // flat (face-up)
            stationGroup.add(statusPlaque);

            // Store the update function on the chest so onSelectStart/click handlers can call it
            chest.userData.updateStatusPlaque = function() {
                const dials = chest.userData.dials;
                const newTex = makeStatusTexture(
                    dials[0].userData.value,
                    dials[1].userData.value,
                    dials[2].userData.value,
                    chest.userData.isUnlocked()
                );
                statusPlaque.material.map = newTex;
                statusPlaque.material.needsUpdate = true;
            };

            // 6. Station label
            makeTextPanel('STATION 3\nTreasure Chest', 6, 2.6, -22, 0.9, 0.35);
        }

        function spawnGlyphs() {
            const symbols = { sun: '☀', star: '★', snake: '〜' };
            const colors  = { sun: '#FFD700', star: '#AAAAFF', snake: '#88FF88' };
            Object.entries(ANSWER).forEach(([type, count]) => {
                for (let i = 0; i < count; i++) {
                    const canvas = document.createElement('canvas');
                    canvas.width = 64; canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = colors[type];
                    ctx.font = '44px serif';
                    ctx.fillText(symbols[type], 10, 50);
                    const plane = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.4), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
                    plane.position.set((Math.random()-0.5)*14, 1+Math.random()*2.5, -24.8);
                    scene.add(plane);
                }
            });
        }

        function buildWallPaintings() {
            // Called for both tomb side walls AND corridor walls
            // Tomb side walls: x=±9 inner face, z centre -17, length 20
            // Corridor walls: x=±2 inner face, z centre -2, length 14

            function drawEgyptMural(cw, ch, seed) {
                const canvas = document.createElement('canvas');
                canvas.width = cw; canvas.height = ch;
                const ctx = canvas.getContext('2d');

                // ── Sandy ochre stone base ──
                const grad = ctx.createLinearGradient(0,0,0,ch);
                grad.addColorStop(0,   '#D4A855');
                grad.addColorStop(0.4, '#C89840');
                grad.addColorStop(1,   '#A07830');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);

                // Age stains
                ctx.globalAlpha = 0.08;
                for (let i=0;i<60;i++){
                    const sx=(i/60)*cw+Math.sin(i)*30;
                    ctx.fillStyle = i%3===0?'#7A4A10':i%3===1?'#E8C870':'#5A3010';
                    ctx.fillRect(sx,0,1+Math.random()*4,ch);
                }
                ctx.globalAlpha = 1;

                // ── Frieze bands top & bottom ──
                const FB = Math.round(ch*0.14);
                // Top band
                ctx.fillStyle='#8B3A0A'; ctx.fillRect(0,0,cw,FB);
                // Decorative stripe inside top band
                ctx.fillStyle='#F5C040'; ctx.fillRect(0,FB-4,cw,4);
                ctx.fillStyle='#5A1800'; ctx.fillRect(0,0,cw,3);

                // Bottom band
                ctx.fillStyle='#8B3A0A'; ctx.fillRect(0,ch-FB,cw,FB);
                ctx.fillStyle='#F5C040'; ctx.fillRect(0,ch-FB,cw,4);
                ctx.fillStyle='#5A1800'; ctx.fillRect(0,ch-3,cw,3);

                // Hieroglyphs in bands - repeating rows
                const GLYPHS = ['𓂀','𓆣','𓇳','𓏏','𓆑','𓃭','𓂋','𓅓','𓆗','𓏲','𓇯','𓏭','𓄿','𓇋','𓏲','𓃒'];
                const gSize = Math.round(FB * 0.65);
                ctx.font = `${gSize}px serif`;
                ctx.fillStyle = '#F5D080';
                ctx.textAlign = 'left';
                const step = gSize + 4;
                for (let gx=0; gx<cw; gx+=step) {
                    const gi = Math.floor(gx/step + seed) % GLYPHS.length;
                    ctx.fillText(GLYPHS[gi], gx+2, FB-4);
                    ctx.fillText(GLYPHS[(gi+7)%GLYPHS.length], gx+2, ch-5);
                }

                // ── Scene area ──
                const SY = FB + 2;
                const SH = ch - FB*2 - 4;
                const GY = SY + SH; // ground line y

                // Ground register line
                ctx.strokeStyle='#6B3010'; ctx.lineWidth=2;
                ctx.beginPath(); ctx.moveTo(0,GY-2); ctx.lineTo(cw,GY-2); ctx.stroke();

                // Top register line
                ctx.beginPath(); ctx.moveTo(0,SY+2); ctx.lineTo(cw,SY+2); ctx.stroke();

                // ── Figure drawing ──
                function fig(x, scl, dir, type) {
                    // type: 0=pharaoh, 1=priest, 2=god, 3=worker, 4=seated
                    ctx.save();
                    ctx.translate(x, GY);
                    ctx.scale(dir * scl, scl);

                    const H = 160; // figure height in canvas units
                    const skin  = type===2?'#8B4513': type===3?'#A0522D':'#CD853F';
                    const kilt  = type===2?'#DAA520': type===1?'#F5F5DC':'#FFFFFF';
                    const crown = type===0?'#1E5A8A': type===2?'#DAA520':'none';

                    // Legs (stride pose)
                    ctx.fillStyle=skin;
                    ctx.fillRect(-6, -H*0.47, 10, H*0.47);  // back leg
                    ctx.fillRect(8,  -H*0.50, 10, H*0.47);  // front leg

                    // Kilt/skirt
                    ctx.fillStyle=kilt;
                    ctx.beginPath();
                    ctx.moveTo(-8,-H*0.47); ctx.lineTo(22,-H*0.47);
                    ctx.lineTo(20,-H*0.27); ctx.lineTo(-6,-H*0.27);
                    ctx.closePath(); ctx.fill();
                    ctx.strokeStyle='#8B6914'; ctx.lineWidth=1; ctx.stroke();
                    if(type===2){// gold belt
                        ctx.strokeStyle='#FFD700'; ctx.lineWidth=2;
                        ctx.beginPath();ctx.moveTo(-8,-H*0.47);ctx.lineTo(22,-H*0.47);ctx.stroke();
                    }

                    // Torso
                    ctx.fillStyle=skin;
                    ctx.fillRect(-6,-H*0.77, 26, H*0.31);

                    // Collar necklace
                    ctx.strokeStyle='#DAA520'; ctx.lineWidth=3;
                    ctx.beginPath(); ctx.arc(7,-H*0.65,14,-Math.PI*0.8,0.1); ctx.stroke();
                    // Collar beads
                    ctx.fillStyle='#1E5A8A';
                    for(let b=0;b<5;b++){
                        const ba=-Math.PI*0.75+b*(Math.PI*0.85/4);
                        ctx.beginPath(); ctx.arc(7+Math.cos(ba)*14,-H*0.65+Math.sin(ba)*14,2.5,0,Math.PI*2); ctx.fill();
                    }

                    // Head (profile)
                    ctx.fillStyle=skin;
                    ctx.beginPath(); ctx.ellipse(8,-H*0.88,12,15,-0.1,0,Math.PI*2); ctx.fill();

                    // Crown/headdress
                    if(type===0){ // nemes blue+gold stripes
                        ctx.fillStyle='#1E5A8A';
                        ctx.beginPath();
                        ctx.moveTo(-4,-H*0.98); ctx.lineTo(20,-H*0.98);
                        ctx.lineTo(18,-H*0.77); ctx.lineTo(-2,-H*0.77);
                        ctx.closePath(); ctx.fill();
                        ctx.fillStyle='#DAA520';
                        for(let s=0;s<4;s++) ctx.fillRect(-3+s*5,-H*0.98,3,H*0.21);
                        // uraeus
                        ctx.fillStyle='#C03020';
                        ctx.beginPath(); ctx.arc(18,-H*0.98,4,0,Math.PI*2); ctx.fill();
                    } else if(type===2){ // tall white double crown
                        ctx.fillStyle='#F5F5DC';
                        ctx.fillRect(0,-H*1.22,16,H*0.25);
                        ctx.beginPath(); ctx.arc(8,-H*1.22,8,Math.PI,0); ctx.fill();
                        ctx.fillStyle='#C03020'; // red inner
                        ctx.fillRect(3,-H*1.18,10,H*0.18);
                    } else if(type===1){ // shaved or wig
                        ctx.fillStyle='#1A0A00';
                        ctx.beginPath(); ctx.ellipse(7,-H*0.90,11,13,0,0,Math.PI*2); ctx.fill();
                    }

                    // Eye (kohl-lined profile)
                    ctx.fillStyle='#1A0A00';
                    ctx.beginPath(); ctx.ellipse(16,-H*0.86,5,3,0,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#FFFFFF';
                    ctx.beginPath(); ctx.ellipse(15,-H*0.86,3,2,0,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#1A0A00';
                    ctx.beginPath(); ctx.arc(16,-H*0.86,2,0,Math.PI*2); ctx.fill();
                    // kohl line
                    ctx.strokeStyle='#000'; ctx.lineWidth=1.5;
                    ctx.beginPath(); ctx.moveTo(20,-H*0.84); ctx.lineTo(26,-H*0.80); ctx.stroke();

                    // Forward arm (offering)
                    ctx.strokeStyle=skin; ctx.lineWidth=7;
                    ctx.beginPath(); ctx.moveTo(8,-H*0.68); ctx.lineTo(34,-H*0.55); ctx.stroke();
                    ctx.fillStyle=skin;
                    ctx.beginPath(); ctx.arc(34,-H*0.53,6,0,Math.PI*2); ctx.fill();

                    // Back arm (down)
                    ctx.beginPath(); ctx.moveTo(4,-H*0.68); ctx.lineTo(-2,-H*0.50); ctx.stroke();

                    // Worker variant: bent carrying pose
                    if(type===3){
                        ctx.strokeStyle=skin; ctx.lineWidth=7;
                        ctx.beginPath(); ctx.moveTo(8,-H*0.68); ctx.lineTo(10,-H*0.45); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(4,-H*0.68); ctx.lineTo(-8,-H*0.78); ctx.stroke();
                        // load on back
                        ctx.fillStyle='#8B6914';
                        ctx.fillRect(-14,-H*0.88,12,18);
                    }

                    ctx.restore();
                }

                // ── Glyph column ──
                function glyphCol(x, n, off) {
                    const gs2 = Math.round(SH*0.11);
                    ctx.font=`${gs2}px serif`; ctx.fillStyle='#5A2800'; ctx.textAlign='center';
                    for(let i=0;i<n;i++) ctx.fillText(GLYPHS[(off+i)%GLYPHS.length], x, SY+14+i*(gs2+2));
                }

                // ── Decorative elements ──
                function lotus(x) {
                    ctx.strokeStyle='#2A7A30'; ctx.lineWidth=2;
                    ctx.beginPath(); ctx.moveTo(x,GY-2); ctx.lineTo(x,GY-SH*0.4); ctx.stroke();
                    const ly=GY-SH*0.4;
                    const pColors=['#E860A0','#C040A0','#FF80C0','#D050B0','#F070B0'];
                    for(let p=0;p<5;p++){
                        const a=(p/5)*Math.PI*2-Math.PI/2;
                        ctx.fillStyle=pColors[p];
                        ctx.beginPath();
                        ctx.ellipse(x+Math.cos(a)*10,ly+Math.sin(a)*10,5,12,a,0,Math.PI*2);
                        ctx.fill();
                    }
                    ctx.fillStyle='#FFD700';
                    ctx.beginPath(); ctx.arc(x,ly,7,0,Math.PI*2); ctx.fill();
                }

                function ankh(x, y, s) {
                    ctx.strokeStyle='#DAA520'; ctx.lineWidth=s*3;
                    ctx.beginPath(); ctx.moveTo(x,y-s*6); ctx.lineTo(x,y+s*14); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(x-s*6,y); ctx.lineTo(x+s*6,y); ctx.stroke();
                    ctx.beginPath(); ctx.arc(x,y-s*6,s*5,0,Math.PI*2); ctx.stroke();
                }

                function altar(x) {
                    const ay=GY;
                    ctx.fillStyle='#7A4A18';
                    ctx.fillRect(x-28,ay-SH*0.18,56,8);
                    ctx.fillRect(x-22,ay-SH*0.18+8,8,SH*0.18-8);
                    ctx.fillRect(x+14,ay-SH*0.18+8,8,SH*0.18-8);
                    // offerings
                    ctx.fillStyle='#C03020'; ctx.beginPath(); ctx.arc(x-10,ay-SH*0.18-8,7,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#E8C040'; ctx.beginPath(); ctx.arc(x+10,ay-SH*0.18-8,6,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#40A040'; ctx.fillRect(x-4,ay-SH*0.18-24,8,16);
                }

                function scarab(x,y) {
                    ctx.fillStyle='#2040C0';
                    ctx.beginPath(); ctx.ellipse(x,y,14,18,0,0,Math.PI*2); ctx.fill();
                    ctx.strokeStyle='#6080FF'; ctx.lineWidth=1.5;
                    ctx.beginPath();ctx.moveTo(x,y-16);ctx.lineTo(x,y+16);ctx.stroke();
                    ctx.beginPath();ctx.moveTo(x-14,y);ctx.lineTo(x+14,y);ctx.stroke();
                    ctx.fillStyle='#FFD700';
                    ctx.beginPath(); ctx.arc(x,y-26,9,0,Math.PI*2); ctx.fill();
                }

                function sunDisc(x,y,r) {
                    ctx.fillStyle='#FFD700';
                    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
                    ctx.strokeStyle='#FF8C00'; ctx.lineWidth=2; ctx.stroke();
                    for(let i=0;i<12;i++){
                        const a=(i/12)*Math.PI*2;
                        ctx.beginPath();
                        ctx.moveTo(x+Math.cos(a)*(r+2),y+Math.sin(a)*(r+2));
                        ctx.lineTo(x+Math.cos(a)*(r+10),y+Math.sin(a)*(r+10));
                        ctx.strokeStyle='#FFD700'; ctx.lineWidth=1.5; ctx.stroke();
                    }
                }

                // ── Layout: repeating sections ──
                const SEC = Math.round(cw * 0.22); // section width ~22% of canvas
                const nSec = Math.ceil(cw / SEC) + 1;
                const figH = SH * 0.95;
                const figScale = figH / 160;

                for(let s=0; s<nSec; s++){
                    const ox = s * SEC;
                    const sc = (s + seed) % 5;

                    glyphCol(ox+18, 5, (s*3+seed)%GLYPHS.length);

                    if(sc===0){
                        // Pharaoh offering to god at altar
                        fig(ox+70,  figScale*0.9,  1, 0); // pharaoh
                        fig(ox+170, figScale*0.85, 1, 1); // priest
                        altar(ox+SEC*0.58);
                        fig(ox+SEC*0.72, figScale*0.95,-1, 2); // god
                        ankh(ox+SEC*0.58, GY-SH*0.55, figScale*8);
                        scarab(ox+SEC*0.58, SY+SH*0.22);

                    } else if(sc===1){
                        // Procession of workers
                        fig(ox+50,  figScale*0.9,  1, 2);
                        fig(ox+130, figScale*0.8,  1, 3);
                        fig(ox+195, figScale*0.8,  1, 3);
                        fig(ox+260, figScale*0.8,  1, 1);
                        lotus(ox+SEC*0.8);
                        lotus(ox+SEC*0.45);
                        sunDisc(ox+SEC*0.62, SY+SH*0.28, SH*0.12);

                    } else if(sc===2){
                        // Weighing of the heart
                        fig(ox+60,  figScale*0.9,  1, 2);
                        fig(ox+SEC*0.85, figScale*0.85,-1, 1);
                        // Scales of Ma'at
                        const sx=ox+SEC*0.5, sb=SY+SH*0.15;
                        ctx.strokeStyle='#DAA520'; ctx.lineWidth=3;
                        ctx.beginPath();ctx.moveTo(sx,sb);ctx.lineTo(sx,sb+SH*0.55);ctx.stroke();
                        ctx.beginPath();ctx.moveTo(sx-SEC*0.2,sb+SH*0.1);ctx.lineTo(sx+SEC*0.2,sb+SH*0.1);ctx.stroke();
                        ctx.beginPath();ctx.moveTo(sx-SEC*0.2,sb+SH*0.1);ctx.lineTo(sx-SEC*0.2,sb+SH*0.38);ctx.stroke();
                        ctx.arc(sx-SEC*0.2,sb+SH*0.40,SEC*0.08,0,Math.PI); ctx.stroke();
                        ctx.beginPath();ctx.moveTo(sx+SEC*0.2,sb+SH*0.1);ctx.lineTo(sx+SEC*0.2,sb+SH*0.28);ctx.stroke();
                        ctx.beginPath();ctx.arc(sx+SEC*0.2,sb+SH*0.30,SEC*0.08,0,Math.PI); ctx.stroke();
                        ctx.font=`${SH*0.18}px serif`; ctx.textAlign='center';
                        ctx.fillStyle='#C03020'; ctx.fillText('𓃒',sx-SEC*0.2,sb+SH*0.41);
                        ctx.fillStyle='#F5D080'; ctx.fillText('𓆃',sx+SEC*0.2,sb+SH*0.31);
                        ctx.font=`bold ${SH*0.3}px serif`; ctx.fillStyle='#F5D080';
                        ctx.fillText('𓂀',sx,SY+SH*0.35);

                    } else if(sc===3){
                        // Solar barque procession
                        fig(ox+60,  figScale*0.9,  1, 0);
                        fig(ox+145, figScale*0.8,  1, 1);
                        fig(ox+SEC*0.75, figScale*0.85,-1, 1);
                        fig(ox+SEC*0.9,  figScale*0.9, -1, 2);
                        // barque
                        const bx=ox+SEC*0.52, by=GY-SH*0.32;
                        ctx.fillStyle='#C8922A'; ctx.strokeStyle='#DAA520'; ctx.lineWidth=2;
                        ctx.beginPath();
                        ctx.moveTo(bx-SEC*0.16,by);
                        ctx.quadraticCurveTo(bx,by+SH*0.12,bx+SEC*0.16,by);
                        ctx.quadraticCurveTo(bx,by-SH*0.04,bx-SEC*0.16,by);
                        ctx.fill(); ctx.stroke();
                        sunDisc(bx, by-SH*0.18, SH*0.11);
                        lotus(ox+SEC*0.52-SEC*0.1);
                        lotus(ox+SEC*0.52+SEC*0.1);

                    } else {
                        // Animal-headed gods ceremony
                        fig(ox+60,  figScale*0.9, 1, 2);
                        fig(ox+150, figScale*0.85,1, 0);
                        fig(ox+240, figScale*0.8, 1, 1);
                        altar(ox+SEC*0.62);
                        fig(ox+SEC*0.78, figScale*0.9,-1, 2);
                        ankh(ox+SEC*0.3, GY-SH*0.5, figScale*7);
                        scarab(ox+SEC*0.15, SY+SH*0.25);
                    }
                }

                return canvas;
            }

            // ── Load the mural texture once, apply to all walls ──
            const muralLoader = new THREE.TextureLoader();

            // Show canvas fallback immediately, swap to real photo when loaded
            const fallbackCanvas = drawEgyptMural(4096, 512, 0);
            const fallbackTex = new THREE.CanvasTexture(fallbackCanvas);

            // All mural materials share the same texture (one load)
            const muralMats = [];

            function muralMesh(w, h, pos, rotY) {
                const mat = new THREE.MeshBasicMaterial({ map: fallbackTex, side: THREE.FrontSide });
                muralMats.push(mat);
                const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
                mesh.position.copy(pos);
                mesh.rotation.y = rotY;
                scene.add(mesh);
                return mesh;
            }

            // ── MURAL BANDS — thick horizontal strip in middle, wall colour shows above/below ──
            // Band is 1.8m tall, centred at y=1.8 (from y=0.9 to y=2.7)
            // Wall colour shows below (y=0 to 0.9) and above (y=2.7 to 5.4)
            const BAND_H = 1.8;
            const BAND_Y = 1.8;

            // TOMB SIDE WALLS
            muralMesh(20, BAND_H, new THREE.Vector3(-8.83, BAND_Y, -17),  Math.PI/2);
            muralMesh(20, BAND_H, new THREE.Vector3( 8.83, BAND_Y, -17), -Math.PI/2);

            // TOMB BACK WALL (z=-27)
            muralMesh(18, BAND_H, new THREE.Vector3(0, BAND_Y, -26.83), 0);

            // TOMB FRONT WALL (z=-7, either side of corridor opening)
            muralMesh(6, BAND_H, new THREE.Vector3(-6, BAND_Y, -7.17), Math.PI);
            muralMesh(6, BAND_H, new THREE.Vector3( 6, BAND_Y, -7.17), Math.PI);

            // CORRIDOR SIDE WALLS — corridor is shorter (3.5m tall), so use smaller band
            // Corridor band: 1.4m tall centred at y=1.5 (from y=0.8 to y=2.2)
            muralMesh(16, 1.4, new THREE.Vector3(-1.83, 1.5, -1),  Math.PI/2);
            muralMesh(16, 1.4, new THREE.Vector3( 1.83, 1.5, -1), -Math.PI/2);

            // Swap all to real texture once loaded
            muralLoader.load('Assets/textures/facts-about-ancient-egypt-1.jpg', (tex) => {
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.ClampToEdgeWrapping;
                muralMats.forEach(m => { m.map = tex; m.needsUpdate = true; });
            });
        }

        function buildEgyptExit() {
            const DOOR_Z = 6.2;

            // ── Door frame ──
            const frameMat = new THREE.MeshStandardMaterial({color:0x8B6914,roughness:0.7,metalness:0.3,emissive:0x3A2A00,emissiveIntensity:0.4});
            [[-1.5,2,DOOR_Z],[1.5,2,DOOR_Z]].forEach(([x,y,z])=>{
                const j=new THREE.Mesh(new THREE.BoxGeometry(0.4,4,0.4),frameMat);
                j.position.set(x,y,z); scene.add(j);
            });
            const lintel=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.5,0.4),frameMat);
            lintel.position.set(0,4.1,DOOR_Z); scene.add(lintel);

            // ── Animated door halves — decorated Egyptian wood ──
            // Draw wood grain + hieroglyph panel as texture
            function doorTex() {
                const dc = document.createElement('canvas');
                dc.width = 256; dc.height = 512;
                const dx = dc.getContext('2d');
                // Dark wood base
                const wg = dx.createLinearGradient(0,0,256,0);
                wg.addColorStop(0, '#3A1A06');
                wg.addColorStop(0.5, '#5A2A0A');
                wg.addColorStop(1, '#3A1A06');
                dx.fillStyle = wg; dx.fillRect(0,0,256,512);
                // Vertical wood grain streaks
                dx.strokeStyle = 'rgba(20,8,0,0.4)';
                dx.lineWidth = 2;
                for (let i = 0; i < 18; i++) {
                    dx.beginPath();
                    dx.moveTo(10 + i * 14, 0);
                    dx.lineTo(10 + i * 14 + Math.sin(i)*4, 512);
                    dx.stroke();
                }
                // Carved panel in centre
                dx.strokeStyle = '#8B6914';
                dx.lineWidth = 4;
                dx.strokeRect(30, 80, 196, 350);
                dx.strokeRect(40, 90, 176, 330);
                // Hieroglyphs inside panel
                dx.fillStyle = '#DAA520';
                dx.font = 'bold 52px serif';

        function onSelectStart(event) {
            const controller = event.target;
            raycaster.setFromXRController(controller);

            // ── PRIORITY: check chest dial / key / keyhole / lever FIRST ──
            // These checks happen before puzzle1TryGrab so both controllers work consistently
            const priorityHits = raycaster.intersectObjects(grabbableObjects, true);
            console.log('VR select - controller:', controller.userData.handedness || '(unknown)', 'hits:', priorityHits.length);
            for (const hit of priorityHits) {
                let target = hit.object;
                while (target && !target.userData.type) target = target.parent;
                if (!target) continue;
                const t = target.userData.type;
                console.log('VR select - target type:', t);

                if (t === 'lever') {
                    scene.userData.leverPulled = true;
                    scene.userData.leverT = 0;
                    console.log('Lever pulled! (VR controller)');
                    return;
                }
                if (t === 'dial') {
                    const chest = target.parent;
                    if (chest && chest.userData.updateDial && !chest.userData.isUnlocked()) {
                        target.userData.value = (target.userData.value + 1) % 10;
                        chest.userData.updateDial(target);
                        updateChestStatus(chest);
                        console.log('Dial advanced to:', target.userData.value);
                    }
                    return;
                }
                if (t === 'chestKey' && target.userData.grabbable && !target.userData.grabbed) {
                    // Attach key to controller so it follows along
                    controller.attach(target);
                    target.position.set(0, -0.05, -0.15); // sit just in front of controller
                    target.rotation.set(0, 0, 0);
                    target.userData.grabbed = true;
                    target.userData.heldByController = controller;
                    controller.userData.selected = target;
                    controller.userData.selectedType = 'chestKey';
                    scene.userData.keyObtained = true;
                    console.log('🗝 Chest key grabbed by controller');
                    return;
                }
                if (t === 'keyholeStand' && scene.userData.keyObtained && !scene.userData.keyInserted) {
                    insertKeyIntoStand();
                    return;
                }
            }

            // ── Fallback to puzzle1's grab logic ──
            if (puzzle1TryGrab(controller, raycaster)) return;
if (!station1Solved) { if (puzzle2TryGrab(controller, raycaster)) { showLockMessage('Complete the Tablet first!'); } }
else if (puzzle2TryGrab(controller, raycaster)) return;
            // ── Default: just attach whatever was hit ──
            if (priorityHits.length > 0) {
                const object = priorityHits[0].object;
                controller.attach(object);
                controller.userData.selected = object;
                if (object.userData.type === 'scrollPiece') controller.userData.selectedType = 'scroll';
                if (object.userData.type === 'weight') controller.userData.selectedType = 'weight';
            }
        }

        // Update the chest status — refreshes the 3D plaque on the table
        function updateChestStatus(chest) {
            if (chest && chest.userData.updateStatusPlaque) {
                chest.userData.updateStatusPlaque();
            }
        }

        function onSelectEnd(event) {
            const controller = event.target;
            const obj = controller.userData.selected;
            if (puzzle1TryRelease(controller)) return;
            if (puzzle2TryRelease(controller)) return;
            if (!obj) return;

            // ── KEEP the chest key on the controller — it should not drop when trigger released ──
            // Player carries it until they click the keyhole stand
            if (controller.userData.selectedType === 'chestKey') {
                console.log('Chest key stays attached to controller');
                return;
            }

            scene.attach(obj);
            const type = controller.userData.selectedType;
            if (type === 'scroll') {
                const target = scrollSnapTargets[obj.name];
                if (target && obj.position.distanceTo(target) < 0.3) {
                    obj.position.copy(target);
                    obj.rotation.set(-Math.PI / 2, 0, 0);
                    scrollSolved.add(obj.name);
                    if (scrollSolved.size === 4) solveStation1();
                }
            }
            controller.userData.selected = undefined;
        }

        function addBox(x, y, z, w, h, d, mat) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);

        function makeTextPanel(text, x, y, z, w, h) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            // Draw initial text
            renderTextOntoCanvas(ctx, canvas, text);
            const tex = new THREE.CanvasTexture(canvas);
            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(w, h),
                new THREE.MeshBasicMaterial({ map: tex, transparent: true })
            );
            mesh.position.set(x, y, z);
            // Stash the canvas + ctx + texture so updateTextPanel can rewrite later
            mesh.userData.canvas = canvas;
            mesh.userData.ctx = ctx;
            mesh.userData.tex = tex;
            scene.add(mesh);
            return mesh;
        }

        function renderTextOntoCanvas(ctx, canvas, text) {
            ctx.fillStyle = '#1a0800';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 60px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const lines = text.split('\n');
            const lineH = 70;
            const startY = (canvas.height - (lines.length - 1) * lineH) / 2;
            lines.forEach((line, i) => {
                ctx.fillText(line, canvas.width / 2, startY + i * lineH);
            });
        }

        function updateTextPanel(mesh, newText) {
            if (!mesh || !mesh.userData.canvas) return;
            renderTextOntoCanvas(mesh.userData.ctx, mesh.userData.canvas, newText);
            mesh.userData.tex.needsUpdate = true;
        }

        function placeTorch(parent, x, y, z, lightIntensity = 1.5) {
            if (!torchTemplate) {
                pendingTorchPlacements.push({ parent, x, y, z, lightIntensity });
                return;
            }
            const torch = torchTemplate.clone();
            torch.position.set(x, y, z);
            parent.add(torch);

            // Main warm torch light
            const light = new THREE.PointLight(0xFF5500, lightIntensity, 14);
            light.position.set(x, y + 0.4, z);
            light.castShadow = true;
            light.shadow.mapSize.width  = 256;
            light.shadow.mapSize.height = 256;
            parent.add(light);

            // Secondary subtle fill — slightly cooler colour for depth
            const fill = new THREE.PointLight(0xFF2200, lightIntensity * 0.35, 8);
            fill.position.set(x, y + 0.1, z);
            parent.add(fill);

            // Register both for flicker with individual random phase offset
            torchLights.push({ light, fill, baseIntensity: lightIntensity, phase: Math.random() * Math.PI * 2 });
        }

        function spawnTorch(parent, x, y, z) { placeTorch(parent, x, y, z, 1.5); }
