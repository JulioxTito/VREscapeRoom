<!DOCTYPE html>
<html lang="en">

<head>
    <title>VR Pyramid Tomb Escape</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #110800;
        }
    </style>
</head>

<body>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
            }
        }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // -------------------------------------------------------------------
        // GLOBALS
        // -------------------------------------------------------------------
        let camera, scene, renderer, raycaster;
        let controller1, controller2;
        let controllerGrip1, controllerGrip2;
        let cameraRig; // Parent object we move for locomotion

        // Movement
        const moveSpeed = 2.0;
        const snapAngle = Math.PI / 4; // 45 degrees
        let canSnapLeft = true;
        let canSnapRight = true;

        // WASD keys for desktop testing
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup',   e => keys[e.key.toLowerCase()] = false);

        // Game state
        let gamePhase = 'corridor'; // 'corridor' | 'tomb'
        let scarab = null;
        let pedestal = null;
        let pedestalSinking = false;
        let grabbableObjects = [];
        const intersected = [];

        // Tomb room group
        let tombRoom = null;

        // Torch model cache
        let torchTemplate = null;
        const pendingTorchPlacements = [];
        const loader = new GLTFLoader();

        loader.load('Assets/Models/torch/scene.gltf', (gltf) => {
            torchTemplate = gltf.scene;
            torchTemplate.scale.set(0.5, 0.5, 0.5);

            torchTemplate.traverse((child) => {
                if (!child.isMesh) return;
                const matName = child.material.name.toLowerCase();
                if (matName === 'flames') {
                    // Hide the sprite sheet plane — we use our own flame sphere
                    child.visible = false;
                } else {
                    // Torch body — no emissive blowout
                    child.material.emissiveIntensity = 0.05;
                }
            });

            pendingTorchPlacements.forEach(p => placeTorch(p.parent, p.x, p.y, p.z, p.lightIntensity));
            pendingTorchPlacements.length = 0;
            console.log('Torch model loaded successfully');
        }, undefined, (err) => {
            console.error('Torch failed:', err);
        });

        init();

        // -------------------------------------------------------------------
        // INIT
        // -------------------------------------------------------------------
        function init() {

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x110800);
            scene.fog = new THREE.Fog(0x110800, 5, 20);

            // Camera Rig — move this for locomotion
            cameraRig = new THREE.Group();
            cameraRig.position.set(0, 0, 4); // Start at corridor entrance
            scene.add(cameraRig);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50);
            camera.position.set(0, 1.6, 0);
            cameraRig.add(camera);

            // Dim ambient — torches carry the scene
            scene.add(new THREE.AmbientLight(0x3D1F00, 0.4));

            buildCorridor();
            buildTombRoom();

            // --- RENDERER ---
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setAnimationLoop(animate);
            renderer.xr.enabled = true;
            renderer.shadowMap.enabled = true;

            document.body.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));

            // --- CONTROLLERS (added to cameraRig so they move with player) ---
            raycaster = new THREE.Raycaster();

            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onSelectStart);
            controller1.addEventListener('selectend', onSelectEnd);
            cameraRig.add(controller1);

            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', onSelectStart);
            controller2.addEventListener('selectend', onSelectEnd);
            cameraRig.add(controller2);

            const factory = new XRControllerModelFactory();

            controllerGrip1 = renderer.xr.getControllerGrip(0);
            controllerGrip1.add(factory.createControllerModel(controllerGrip1));
            cameraRig.add(controllerGrip1);

            controllerGrip2 = renderer.xr.getControllerGrip(1);
            controllerGrip2.add(factory.createControllerModel(controllerGrip2));
            cameraRig.add(controllerGrip2);

            // Laser pointer lines
            const lineGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -1)
            ]);
            const line = new THREE.Line(lineGeo);
            line.name = 'line';
            line.scale.z = 5;
            controller1.add(line.clone());
            controller2.add(line.clone());

            window.addEventListener('resize', onWindowResize);
        }

        // -------------------------------------------------------------------
        // BUILD CORRIDOR
        // Dark reddish tunnel. Torches only light source.
        // Golden scarab glows at the far end on a pedestal.
        // -------------------------------------------------------------------
        function buildCorridor() {

            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x6B3A1F, roughness: 1.0 });
            const darkMat  = new THREE.MeshStandardMaterial({ color: 0x3D1F08, roughness: 1.0 });

            // Floor
            addBox(0, -0.1, -2, 4, 0.2, 14, darkMat);
            // Ceiling
            addBox(0, 3.6, -2, 4, 0.2, 14, darkMat);
            // Left wall
            addBox(-2, 1.75, -2, 0.2, 3.5, 14, stoneMat);
            // Right wall
            addBox(2, 1.75, -2, 0.2, 3.5, 14, stoneMat);

            // Torch pairs along corridor
            [
                { x: -1.8, z:  2 },
                { x:  1.8, z:  2 },
                { x: -1.8, z: -1 },
                { x:  1.8, z: -1 },
                { x: -1.8, z: -4 },
                { x:  1.8, z: -4 },
            ].forEach(p => spawnTorch(scene, p.x, 2.0, p.z));

            // Pedestal
            const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x5C3D1E, roughness: 0.8 });
            pedestal = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.0, 0.5), pedestalMat);
            pedestal.position.set(0, 0.5, -8);
            scene.add(pedestal);

            // Golden Scarab (placeholder box — Blender model replaces this later)
            const scarabMat = new THREE.MeshStandardMaterial({
                color: 0xFFD700,
                roughness: 0.2,
                metalness: 0.9,
                emissive: new THREE.Color(0xFFAA00),
                emissiveIntensity: 0.4
            });
            scarab = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, 0.3), scarabMat);
            scarab.position.set(0, 1.15, -8);
            scarab.name = 'scarab';
            scene.add(scarab);
            grabbableObjects.push(scarab);

            // Glow above scarab to draw the player's eye
            const glow = new THREE.PointLight(0xFFCC00, 2, 3);
            glow.position.set(0, 1.6, -8);
            scene.add(glow);
        }

        // -------------------------------------------------------------------
        // BUILD TOMB ROOM
        // Bigger room beyond the corridor. Starts hidden.
        // 3 puzzle platforms: left, center-back, right.
        // Only puzzle 1 lights up when phase 2 starts.
        // -------------------------------------------------------------------
        function buildTombRoom() {

            tombRoom = new THREE.Group();
            scene.add(tombRoom);

            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x9C8A6E, roughness: 0.9 });
            const wallMat  = new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 0.9 });
            const darkMat  = new THREE.MeshStandardMaterial({ color: 0x4A3A2A, roughness: 1.0 });

            // Floor & Ceiling
            addBoxTo(tombRoom,  0, -0.1, -17,  16, 0.2, 16, stoneMat);
            addBoxTo(tombRoom,  0,  4.6, -17,  16, 0.2, 16, darkMat);

            // Walls
            addBoxTo(tombRoom,  0, 2.3, -25, 16, 4.7, 0.3, wallMat); // back
            addBoxTo(tombRoom, -8, 2.3, -17, 0.3, 4.7, 16, wallMat); // left
            addBoxTo(tombRoom,  8, 2.3, -17, 0.3, 4.7, 16, wallMat); // right

            // Connector wall between corridor and tomb (with opening)
            addBoxTo(tombRoom, -3.5, 2.3, -9, 5.5, 4.7, 0.3, wallMat);
            addBoxTo(tombRoom,  3.5, 2.3, -9, 5.5, 4.7, 0.3, wallMat);
            // Top of doorway
            addBoxTo(tombRoom,  0, 3.8, -9, 3, 1.5, 0.3, wallMat);

            // --- PUZZLE PLATFORMS ---

            // Puzzle 1 — Broken Tablet (LEFT)
            const p1Platform = addBoxTo(tombRoom, -5, 0.05, -17, 4, 0.1, 4, 
                new THREE.MeshStandardMaterial({ color: 0x6B5A3E, roughness: 0.9 }));

            // Puzzle 1 torches (start visible, will light up in phase 2)
            spawnTorchTo(tombRoom, -6.5, 2, -15, true);
            spawnTorchTo(tombRoom, -3.5, 2, -15, true);

            // Puzzle 1 light (starts OFF)
            const p1Light = new THREE.PointLight(0xff5500, 0, 8);
            p1Light.name = 'puzzle1Light';
            p1Light.position.set(-5, 3, -17);
            tombRoom.add(p1Light);

            // Puzzle 2 — Scale (CENTER BACK)
            addBoxTo(tombRoom, 0, 0.05, -22, 4, 0.1, 4,
                new THREE.MeshStandardMaterial({ color: 0x4A3A2A, roughness: 1.0 }));

            // Puzzle 3 — Combo Lock (RIGHT)
            addBoxTo(tombRoom, 5, 0.05, -17, 4, 0.1, 4,
                new THREE.MeshStandardMaterial({ color: 0x4A3A2A, roughness: 1.0 }));

            // Hide tomb room until scarab is grabbed
            tombRoom.visible = false;
        }

        // -------------------------------------------------------------------
        // PHASE 2 — Scarab grabbed, tomb opens
        // -------------------------------------------------------------------
        function triggerPhase2() {
            gamePhase = 'tomb';
            scarab.visible = false;
            pedestalSinking = true;
            tombRoom.visible = true;

            // Light up Puzzle 1
            const p1Light = tombRoom.getObjectByName('puzzle1Light');
            if (p1Light) p1Light.intensity = 2.5;

            // Remove scarab from grabbable list
            grabbableObjects = grabbableObjects.filter(o => o.name !== 'scarab');

            console.log('Phase 2 — Tomb revealed. Puzzle 1 lit.');
        }

        // -------------------------------------------------------------------
        // CONTROLLER EVENTS
        // -------------------------------------------------------------------
        function onSelectStart(event) {
            const controller = event.target;
            raycaster.setFromXRController(controller);

            const hits = raycaster.intersectObjects(grabbableObjects, true);
            if (hits.length > 0) {
                const object = hits[0].object;

                if (object.name === 'scarab' && gamePhase === 'corridor') {
                    triggerPhase2();
                } else {
                    // Generic grab
                    object.material.emissive = new THREE.Color(0x0044ff);
                    object.material.emissiveIntensity = 0.5;
                    controller.attach(object);
                    controller.userData.selected = object;
                }
            }
        }

        function onSelectEnd(event) {
            const controller = event.target;
            if (controller.userData.selected !== undefined) {
                const object = controller.userData.selected;
                object.material.emissiveIntensity = 0;
                scene.attach(object);
                controller.userData.selected = undefined;
            }
        }

        // -------------------------------------------------------------------
        // WASD MOVEMENT — desktop testing only, remove before final submission
        // -------------------------------------------------------------------
        function handleKeyboard() {
            const delta = 1 / 60;
            const speed = 3.0;

            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            if (keys['w'] || keys['arrowup'])    cameraRig.position.addScaledVector(forward,  speed * delta);
            if (keys['s'] || keys['arrowdown'])  cameraRig.position.addScaledVector(forward, -speed * delta);
            if (keys['a'] || keys['arrowleft'])  cameraRig.position.addScaledVector(right,   -speed * delta);
            if (keys['d'] || keys['arrowright']) cameraRig.position.addScaledVector(right,    speed * delta);

            // Q/E to rotate view on desktop
            if (keys['q']) cameraRig.rotation.y += 0.02;
            if (keys['e']) cameraRig.rotation.y -= 0.02;

            // F key to trigger phase 2 (for testing without grabbing)
            if (keys['f'] && gamePhase === 'corridor') {
                triggerPhase2();
                keys['f'] = false; // prevent repeat
            }
        }

        // -------------------------------------------------------------------
        // SMOOTH LOCOMOTION
        // Left stick = move, Right stick = snap rotate 45°
        // -------------------------------------------------------------------
        function handleLocomotion() {
            const session = renderer.xr.getSession();
            if (!session) return;

            const delta = 1 / 72;

            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                const axes = source.gamepad.axes;

                if (source.handedness === 'left') {
                    const moveX = axes[2] ?? 0;
                    const moveZ = axes[3] ?? 0;

                    if (Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1) {
                        const forward = new THREE.Vector3();
                        camera.getWorldDirection(forward);
                        forward.y = 0;
                        forward.normalize();

                        const right = new THREE.Vector3();
                        right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

                        cameraRig.position.addScaledVector(forward, -moveZ * moveSpeed * delta);
                        cameraRig.position.addScaledVector(right,    moveX * moveSpeed * delta);
                    }
                }

                if (source.handedness === 'right') {
                    const rotX = axes[2] ?? 0;

                    if (rotX > 0.7 && canSnapRight) {
                        cameraRig.rotation.y -= snapAngle;
                        canSnapRight = false;
                    } else if (rotX < -0.7 && canSnapLeft) {
                        cameraRig.rotation.y += snapAngle;
                        canSnapLeft = false;
                    }
                    if (Math.abs(rotX) < 0.3) {
                        canSnapLeft = true;
                        canSnapRight = true;
                    }
                }
            }
        }

        // -------------------------------------------------------------------
        // PEDESTAL SINK ANIMATION
        // -------------------------------------------------------------------
        function updatePedestal() {
            if (!pedestalSinking) return;
            if (pedestal.position.y > -1.5) {
                pedestal.position.y -= 0.015;
            } else {
                pedestalSinking = false;
            }
        }

        // -------------------------------------------------------------------
        // HOVER HIGHLIGHT
        // -------------------------------------------------------------------
        function updateHover() {
            while (intersected.length) {
                const obj = intersected.pop();
                if (!obj.userData.grabbed) {
                    obj.material.emissive = new THREE.Color(0x000000);
                    obj.material.emissiveIntensity = 0;
                }
            }

            [controller1, controller2].forEach(ctrl => {
                if (ctrl.userData.selected) return;
                raycaster.setFromXRController(ctrl);
                const hits = raycaster.intersectObjects(grabbableObjects, true);
                const line = ctrl.getObjectByName('line');

                if (hits.length > 0) {
                    const obj = hits[0].object;
                    obj.material.emissive = new THREE.Color(0xff2200);
                    obj.material.emissiveIntensity = 0.5;
                    intersected.push(obj);
                    if (line) line.scale.z = hits[0].distance;
                } else {
                    if (line) line.scale.z = 5;
                }
            });
        }

        // -------------------------------------------------------------------
        // HELPERS — create geometry and add to scene or group
        // -------------------------------------------------------------------
        function addBox(x, y, z, w, h, d, mat) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            return mesh;
        }

        function addBoxTo(group, x, y, z, w, h, d, mat) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            group.add(mesh);
            return mesh;
        }

        // -------------------------------------------------------------------
        // TORCH HELPERS
        // -------------------------------------------------------------------
        function placeTorch(parent, x, y, z, lightIntensity = 1.5) {
            if (!torchTemplate) {
                pendingTorchPlacements.push({ parent, x, y, z, lightIntensity });
                return;
            }
            const torch = torchTemplate.clone();
            torch.position.set(x, y, z);
            if (x < 0) torch.rotation.y = Math.PI / 2;
            if (x > 0) torch.rotation.y = -Math.PI / 2;
            parent.add(torch);

            // Custom flame sphere on top of torch head
            const flameMat = new THREE.MeshStandardMaterial({
                color: 0xFF6600,
                emissive: new THREE.Color(0xFF4400),
                emissiveIntensity: 1.0
            });
            const flame = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), flameMat);
            flame.position.set(x, y + 0.3, z);
            parent.add(flame);

            // Point light
            const light = new THREE.PointLight(0xff5500, lightIntensity, 6);
            light.position.set(x, y + 0.35, z);
            parent.add(light);
        }

        function spawnTorch(parent, x, y, z) {
            placeTorch(parent, x, y, z, 1.5);
        }

        function spawnTorchTo(group, x, y, z, dark = false) {
            placeTorch(group, x, y, z, dark ? 0 : 1.5);
        }

        // -------------------------------------------------------------------
        // WINDOW RESIZE
        // -------------------------------------------------------------------
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // -------------------------------------------------------------------
        // ANIMATE LOOP
        // -------------------------------------------------------------------
        function animate() {
            handleKeyboard();
            handleLocomotion();
            updatePedestal();
            updateHover();
            renderer.render(scene, camera);
        }

    </script>
</body>

</html>
