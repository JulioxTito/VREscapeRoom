                        <div style="font-size: 13px; letter-spacing: 2px; opacity: 0.85;">TIME REMAINING</div>
                        <div id="timerValue" style="font-size: 36px; font-weight: bold; line-height: 1;
                            text-shadow: 0 0 8px rgba(255,215,0,0.6);">10:00</div>
                    </div>
                </div>
                <div id="sandBar" style="height: 6px; background: rgba(0,0,0,0.5); border-radius: 3px;
                    margin-top: 10px; overflow: hidden;">
                    <div id="sandFill" style="height: 100%; width: 100%; background: linear-gradient(90deg, #FFD700, #E3C985);"></div>
                </div>
            `;
            document.body.appendChild(hud);

            // ── AUTO-START TIMER on first user interaction with the scene ──
            // The Quest 3 emulator's "play" button dispatches a click on the canvas, so any of these will trigger:
            // - Click anywhere on the 3D canvas (includes pressing the emulator play button)
            // - Press any key (WASD movement, etc.)
            // - VR controller trigger
            const startTimerOnce = () => {
                if (timerPaused) {
                    timerPaused = false;
                    console.log('▶ Timer started!');
                }
            };
           
            // Also start on first VR controller interaction
            if (controller1) controller1.addEventListener('selectstart', startTimerOnce);
            if (controller2) controller2.addEventListener('selectstart', startTimerOnce);
            // And start on real WebXR session begin
            renderer.xr.addEventListener('sessionstart', startTimerOnce);

            // Stash references so animate() can update them
            timerTextPanel = {
                isHTML: true,
                valueEl: document.getElementById('timerValue'),
                fillEl: document.getElementById('sandFill'),
                hgSandTop: document.getElementById('hgSandTop'),
                hgSandBot: document.getElementById('hgSandBot'),
                userData: { lastTime: '' }
            };
        }

        function handleKeyboard() {
            const delta = 1 / 60;
            const speed = 0.15;
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0; forward.normalize();
            const right = new THREE.Vector3();
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
            if (keys['w']) cameraRig.position.addScaledVector(forward,  speed * delta);
            if (keys['s']) cameraRig.position.addScaledVector(forward, -speed * delta);
            if (keys['a']) cameraRig.position.addScaledVector(right,   -speed * delta);
            if (keys['d']) cameraRig.position.addScaledVector(right,    speed * delta);
            // Press E or SPACE to pull the lever (desktop fallback)
            if ((keys['e'] || keys[' ']) && !scene.userData.leverPulled) {
                scene.userData.leverPulled = true;
                scene.userData.leverT = 0;
                console.log('Lever pulled! (keyboard E/SPACE)');
            }
        }

        function handleLocomotion() {
            const session = renderer.xr.getSession();
            if (!session) return;
            const delta = 1 / 72;
            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                const axes = source.gamepad.axes;
                if (source.handedness === 'left') {
                    const moveX = axes[2] ?? 0;
                    const moveZ = axes[3] ?? 0;
                    const forward = new THREE.Vector3();
                    camera.getWorldDirection(forward);
                    forward.y = 0; forward.normalize();
                    const right = new THREE.Vector3();
                    right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
                    cameraRig.position.addScaledVector(forward, -moveZ * moveSpeed * delta);
                    cameraRig.position.addScaledVector(right,    moveX * moveSpeed * delta);
                }
                if (source.handedness === 'right') {
                    const rotX = axes[2] ?? 0;
                    if (rotX > 0.7 && canSnapRight) { cameraRig.rotation.y -= snapAngle; canSnapRight = false; }
                    else if (rotX < -0.7 && canSnapLeft) { cameraRig.rotation.y += snapAngle; canSnapLeft = false; }
                    if (Math.abs(rotX) < 0.3) { canSnapLeft = true; canSnapRight = true; }
                }
            }
        }
function showLockMessage(msg) {
            let el = document.getElementById('lockMsg');
            if (!el) {
                el = document.createElement('div');
                el.id = 'lockMsg';
                el.style.cssText = `
                    position: fixed; top: 42%; left: 50%;
                    transform: translateX(-50%);
                    color: #FF4040; font-family: serif; font-size: 24px;
                    text-align: center; pointer-events: none;
                    text-shadow: 0 0 12px #FF0000;
                    opacity: 0; transition: opacity 0.3s;
                `;
                document.body.appendChild(el);
            }
            el.textContent = msg;
            el.style.opacity = '1';
            clearTimeout(el._t);
            el._t = setTimeout(() => el.style.opacity = '0', 2000);
        }
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(timestamp) {
            // 1. --- DELTA TIME CALCULATION ---
            // Needed for smooth timer countdown
            const dt = lastTimestamp ? (timestamp - lastTimestamp) / 1000 : 0;
            lastTimestamp = timestamp;

            // 2. --- LOCOMOTION & INPUT ---
            handleKeyboard();
            handleLocomotion();

            // 3. --- TORCH FLICKER ---
            const t = performance.now() * 0.001; 
            torchLights.forEach(({ light, fill, baseIntensity, phase }) => {
                const flicker =
                    Math.sin(t * 7.3  + phase)        * 0.18 +
                    Math.sin(t * 13.7 + phase * 1.3)  * 0.10 +
                    Math.sin(t * 3.1  + phase * 0.7)  * 0.08 +
                    Math.random()                      * 0.06;
                light.intensity = Math.max(0, baseIntensity * (1.0 + flicker));
                fill.intensity  = Math.max(0, baseIntensity * 0.35 * (1.0 + flicker * 0.5));
                const r = Math.min(1, 1.0);
                const g = Math.max(0.18, 0.30 + flicker * 0.15);
                light.color.setRGB(r, g, 0.02);
            });

            // 4. --- HOURGLASS & TIMER LOGIC (HTML overlay, top-right of page) ---
            // Only count down when timer is unpaused
            if (timeRemaining > 0 && !timerPaused) {
                timeRemaining = Math.max(0, timeRemaining - dt);
                const progress = Math.max(0, timeRemaining / 5);

                if (timerTextPanel && timerTextPanel.isHTML) {
                    const mins = Math.floor(timeRemaining / 60);
                    const secs = Math.floor(timeRemaining % 60);
                    const timeString = `${mins}:${secs.toString().padStart(2, '0')}`;
                    if (timerTextPanel.userData.lastTime !== timeString) {
                        timerTextPanel.valueEl.textContent = timeString;
                        timerTextPanel.fillEl.style.width = `${progress * 100}%`;

                        // Animate the SVG hourglass sand: top drains, bottom fills
                        if (timerTextPanel.hgSandTop && timerTextPanel.hgSandBot) {
                            // Top sand polygon — shrinks from full triangle (y:6→28) to nothing
                            // Original full: 7,6 37,6 24,28 22,28 20,28 7,6
                            // As progress goes 1→0, the top point of the sand drops from y=6 to y=28
                            const topY = 6 + (1 - progress) * 22; // y=6 (full) to y=28 (empty)
                            const topW = progress * 15; // width at top
                            timerTextPanel.hgSandTop.setAttribute('points',
                                `${22 - topW},${topY} ${22 + topW},${topY} 24,28 22,28 20,28 ${22 - topW},${topY}`
                            );
                            // Bottom sand polygon — grows from nothing at point (22,55) to full triangle
                            // Full: 6,55 38,55 24,31 ...
                            const botProgress = 1 - progress;
                            const botY = 55 - botProgress * 24; // peak rises from y=55 to y=31
                            const botW = botProgress * 16;
                            timerTextPanel.hgSandBot.setAttribute('points',
                                `${22 - botW},55 ${22 + botW},55 22,${botY} ${22 - botW},55`
                            );
                        }

                        // Color shift
                        if (timeRemaining < 30) {
                            timerTextPanel.valueEl.style.color = '#ff4040';
                            timerTextPanel.fillEl.style.background = 'linear-gradient(90deg, #ff4040, #ff8040)';
                        } else if (timeRemaining < 120) {
                            timerTextPanel.valueEl.style.color = '#ff9020';
                            timerTextPanel.fillEl.style.background = 'linear-gradient(90deg, #ff9020, #FFD700)';
                        } else {
                            timerTextPanel.valueEl.style.color = '#FFD700';
                        }
                        timerTextPanel.userData.lastTime = timeString;
                    }
                }
            } else if (timerTextPanel && timerTextPanel.isHTML && timerTextPanel.userData.lastTime !== '0:00') {
                timerTextPanel.valueEl.textContent = '0:00';
                timerTextPanel.valueEl.style.color = '#ff4040';
                timerTextPanel.fillEl.style.width = '0%';
                timerTextPanel.userData.lastTime = '0:00';
            }

            // 5. --- DOOR COLLISION & ANIMATION ---
            if (scene.userData.DOOR_Z !== undefined) {
                const doorLift = scene.userData.doorSlab ? (scene.userData.doorSlab.position.y - scene.userData.doorSlab.userData.closedY) : 0;
                if (doorLift < 2.5 && cameraRig.position.z > scene.userData.DOOR_Z - 0.5) {
                    cameraRig.position.z = scene.userData.DOOR_Z - 0.5;
                }
            }

            // Portcullis sliding logic
            if (scene.userData.doorSlab && scene.userData.doorOpen && scene.userData.doorT < 1) {
                scene.userData.doorT = Math.min(1, scene.userData.doorT + 0.018);
                const ease = 1 - Math.pow(1 - scene.userData.doorT, 2);
                scene.userData.doorSlab.position.y = scene.userData.doorSlab.userData.closedY + (ease * 4.0);
            }

            // === LEVER RISING ANIMATION (after key inserted into stand) ===
            if (scene.userData.leverRising && scene.userData.leverGroup && scene.userData.leverRiseT < 1) {
                scene.userData.leverRiseT = Math.min(1, scene.userData.leverRiseT + 0.012);
                const ease = 1 - Math.pow(1 - scene.userData.leverRiseT, 3);
                const startY = scene.userData.leverHiddenY;
                const endY = scene.userData.leverFinalY;
                scene.userData.leverGroup.position.y = startY + (endY - startY) * ease;
            }

            // === KEY-IN-KEYHOLE PROXIMITY DETECTION ===
            // If the player is carrying the key and brings it near the keyhole, auto-insert it
            if (scene.userData.keyObtained && !scene.userData.keyInserted && scene.userData.keyholeStand) {
                // Find the held key in the scene
                let heldKey = null;
                scene.traverse(obj => {
                    if (!heldKey && obj.userData?.type === 'chestKey' && obj.userData?.grabbed && obj.visible) {
                        heldKey = obj;
                    }
                });
                if (heldKey) {
                    // Get world positions
                    const keyPos = new THREE.Vector3();
                    heldKey.getWorldPosition(keyPos);
                    // Keyhole center: keyholeStand position + local (0, 0.7, 0.30) rotated by stand's rotation
                    // The stand is at (4.2, 0, -12) rotated by -π/2 around y → local +z becomes world -x
                    // So local (0, 0.7, 0.30) → world (4.2 - 0.30, 0.7, -12) = (3.9, 0.7, -12)
                    const keyholePos = new THREE.Vector3(3.9, 0.7, -12);
                    const dist = keyPos.distanceTo(keyholePos);
                    if (dist < 0.4) {
                        console.log('🗝 Key brought near keyhole — inserting!');
                        insertKeyIntoStand();
                    }
                }
            }

            // === LEVER PULL ANIMATION ===
            if (scene.userData.leverPulled && leverArm && (scene.userData.leverT || 0) < 1) {
                scene.userData.leverT = Math.min(1, (scene.userData.leverT || 0) + 0.025);
                const lt = scene.userData.leverT;
                const angle = lt * Math.PI * 0.5;
                const L = 0.35;
                leverArm.position.set(0, L * Math.cos(angle), 0.25 + L * Math.sin(angle));
                leverArm.rotation.x = angle;
                if (leverArm.userData.knob) {
                    leverArm.userData.knob.position.set(
                        0,
                        (2 * L) * Math.cos(angle),
                        0.25 + (2 * L) * Math.sin(angle)
                    );
                }
                if (leverArm.userData.light) {
                    leverArm.userData.light.color.setHex(0x20FF20);
                }
            }

            // === BACKGROUND: show Egypt sky once lever is pulled ===
            if (scene.userData.egyptStartZ !== undefined) {
                if (scene.userData.leverPulled) {
                    scene.fog = new THREE.FogExp2(0x4A9AE8, 0.002);
                    scene.background = scene.userData.egyptBg || new THREE.Color(0x4A9AE8);
                } else {
                    if (!scene.fog) scene.fog = new THREE.FogExp2(0x0A0402, 0.018);
                    scene.background = scene.userData.tombBg || new THREE.Color(0x0A0402);
                }
            }

            // === DOOR ANIMATION — slab slides UP when lever pulled (portcullis) ===
            if (scene.userData.doorSlab) {
                if (scene.userData.leverPulled && !scene.userData.doorOpen) {
                    scene.userData.doorOpen = true;
                }
                if (scene.userData.doorOpen && scene.userData.doorT < 1) {
                    scene.userData.doorT = Math.min(1, scene.userData.doorT + 0.018);
                    const t = scene.userData.doorT;
                    const ease = 1 - Math.pow(1 - t, 2);
                    const lift = ease * 4.0;
                    scene.userData.doorSlab.position.y = scene.userData.doorSlab.userData.closedY + lift;
                }
            }

            // === YOU ESCAPED detection — when player walks past the door ===
            // Trigger on any of these: door is open AND player past threshold, OR test mode
            if (!scene.userData.escaped) {
                const playerZ = cameraRig.position.z;
                const doorZ = scene.userData.DOOR_Z || 6.2;
                if (scene.userData.doorOpen && playerZ > doorZ + 0.5) {
                    console.log('🏆 Escape triggered! playerZ:', playerZ, 'doorZ:', doorZ);
                    scene.userData.escaped = true;
                    showEscapedSign();
                }
            }
// ── LOCKED ZONE COLLISION ──
            const px = cameraRig.position.x;
            const pz = cameraRig.position.z;
            if (!station1Solved) {
                if (px < -2 && px > -10 && pz < -18 && pz > -26) {
                    cameraRig.position.copy(cameraRig.userData.lastSafePos || new THREE.Vector3(0, 0, -10));
                    showLockMessage('Complete the Tablet first!');
                }
            }
            if (!station2Solved) {
                if (px > 2 && px < 10 && pz < -18 && pz > -26) {
                    cameraRig.position.copy(cameraRig.userData.lastSafePos || new THREE.Vector3(0, 0, -10));
                    showLockMessage('Balance the Scales first!');
                }
            }
            // Save last safe position every frame when not in a locked zone
            const inLockedZone = (!station1Solved && px < -2 && px > -10 && pz < -18 && pz > -26) ||
                                 (!station2Solved && px > 2 && px < 10 && pz < -18 && pz > -26);
            if (!inLockedZone) cameraRig.userData.lastSafePos = cameraRig.position.clone();
            // 6. --- PUZZLE UPDATES & RENDER ---
            puzzle1UpdateHover([controller1, controller2], raycaster);
            puzzle2UpdateHover([controller1, controller2], raycaster);
            puzzle2UpdateBeam();
            renderer.render(scene, camera);
        }

        // Ensure the loop is started correctly
        renderer.setAnimationLoop(animate);

    </script>
</body>
