<!DOCTYPE html>
<html lang="en">

<head>
    <title>VR Pyramid Tomb Escape</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background-color: #110800; }
    </style>
</head>

<body>
    <audio id="bgMusic" src="Assets/audio/tomb_music.mp3" loop></audio>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
            }
        }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // -------------------------------------------------------------------
        // GLOBALS
        // -------------------------------------------------------------------
        let camera, scene, renderer, raycaster;
        let controller1, controller2;
        let controllerGrip1, controllerGrip2;
        let cameraRig;

        const moveSpeed = 2.0;
        const snapAngle = Math.PI / 4;
        let canSnapLeft = true;
        let canSnapRight = true;

        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup',   e => keys[e.key.toLowerCase()] = false);

        let gamePhase = 'tomb';
        let grabbableObjects = [];
        const intersected = [];

        // Puzzle state
        let station1Solved = false;
        let station2Solved = false;
        let station3Solved = false;

        // Station 2 scale state
        let leftPanMass  = 1.0; 
        let rightPanMass = 0.0; 
        let scalePanLeft  = null;
        let scalePanRight = null;
        let scaleBeamMesh = null;
        const scaleObjects = []; 

        // Station 3 glyph counter state
        const ANSWER = { sun: 4, star: 6, snake: 3 };
        const playerInput = { sun: 0, star: 0, snake: 0 };
        let station3Frame = null;
        const counterButtons = []; 

        // Station 1 scroll state
        const scrollPieces = [];
        const scrollSolved = new Set();
        const scrollSnapTargets = {
            piece_0: new THREE.Vector3(-6.25, 0.22, -11.75),
            piece_1: new THREE.Vector3(-5.85, 0.22, -11.75),
            piece_2: new THREE.Vector3(-6.25, 0.22, -12.25),
            piece_3: new THREE.Vector3(-5.85, 0.22, -12.25),
        };

        // Lever state
        let leverArm = null;
        let leverActive = false;
        let leverPulled = false;
        const leverObjects = [];

        // Torch model
        let torchTemplate = null;
        const pendingTorchPlacements = [];
        
        // All torch point lights — animated each frame for flicker
        const torchLights = [];
        const loader = new GLTFLoader();

        loader.load('Assets/Models/torch/scene.gltf', (gltf) => {
            torchTemplate = gltf.scene;
            torchTemplate.scale.set(0.5, 0.5, 0.5);
            torchTemplate.traverse((child) => {
                if (!child.isMesh) return;
                if (child.material.name.toLowerCase() === 'flames') {
                    child.visible = false;
                } else {
                    child.material.emissiveIntensity = 0.05;
                }
            });
            pendingTorchPlacements.forEach(p => placeTorch(p.parent, p.x, p.y, p.z, p.lightIntensity));
            pendingTorchPlacements.length = 0;
        }, undefined, (err) => console.error('Torch failed:', err));

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0A0402); // changed to sky color when outside
            
            // Moderate fog — room stays visible but far end fades naturally
            scene.fog = new THREE.FogExp2(0x0A0402, 0.018); // reduced — exterior needs visibility 

            // Background music — starts on first user interaction (browsers block autoplay)
            const bgMusic = document.getElementById('bgMusic');
            if (bgMusic) {
                bgMusic.volume = 0.3; // 30% volume — change to adjust loudness (0.0 to 1.0)
                const startMusic = () => bgMusic.play().catch(() => {});
                document.addEventListener('click', startMusic, { once: true });
                document.addEventListener('keydown', startMusic, { once: true });
                // VR session also counts as interaction
                if (window.addEventListener) {
                    window.addEventListener('touchstart', startMusic, { once: true });
                }
            }

            cameraRig = new THREE.Group();
            cameraRig.position.set(0, 0, -10); 
            scene.add(cameraRig);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(0, 1.6, 0);
            cameraRig.add(camera);

            // Warm ambient — enough to see stone surfaces clearly, torches add drama
            scene.add(new THREE.AmbientLight(0x6B3010, 2.0)); 

            // Hemisphere: warm firelight from below bouncing off stone floor, cool dark above
            const hemi = new THREE.HemisphereLight(0x7A3208, 0x080200, 1.4);
            scene.add(hemi);

            buildCorridor();
            buildTombRoom();
            buildStation1();
            buildStation2();
            buildStation3();
            buildStation4(); 
            buildLever();
            buildWallPaintings();
            buildEgyptExit();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setAnimationLoop(animate);
            renderer.xr.enabled = true;
            renderer.shadowMap.enabled = true;
            
            // Enhanced shadows for contrast
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            document.body.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));

            raycaster = new THREE.Raycaster();

            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onSelectStart);
            controller1.addEventListener('selectend', onSelectEnd);
            cameraRig.add(controller1);

            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', onSelectStart);
            controller2.addEventListener('selectend', onSelectEnd);
            cameraRig.add(controller2);

            const factory = new XRControllerModelFactory();
            controllerGrip1 = renderer.xr.getControllerGrip(0);
            controllerGrip1.add(factory.createControllerModel(controllerGrip1));
            cameraRig.add(controllerGrip1);

            controllerGrip2 = renderer.xr.getControllerGrip(1);
            controllerGrip2.add(factory.createControllerModel(controllerGrip2));
            cameraRig.add(controllerGrip2);

            const lineGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -1)
            ]);
            const line = new THREE.Line(lineGeo);
            line.name = 'line';
            line.scale.z = 5;
            controller1.add(line.clone());
            controller2.add(line.clone());

            // Desktop mouse click — triggers lever when clicked
            renderer.domElement.addEventListener('click', (e) => {
                if (renderer.xr.isPresenting) return; // only in non-VR mode
                const mouse = new THREE.Vector2(
                    (e.clientX / window.innerWidth) * 2 - 1,
                    -(e.clientY / window.innerHeight) * 2 + 1
                );
                const rc = new THREE.Raycaster();
                rc.setFromCamera(mouse, camera);
                const hits = rc.intersectObjects(grabbableObjects, true);
                for (const h of hits) {
                    let o = h.object;
                    while (o && !o.userData.type) o = o.parent;
                    if (o && o.userData.type === 'lever') {
                        scene.userData.leverPulled = true;
                        scene.userData.leverT = 0;
                        console.log('Lever pulled via mouse click!');
                        return;
                    }
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        function buildCorridor() {
            // Match tomb room materials exactly
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x3D2515, roughness: 0.95 });
            const wallMat  = new THREE.MeshStandardMaterial({ color: 0x4A2D18, roughness: 0.9  });
            const ceilMat  = new THREE.MeshStandardMaterial({ color: 0x150A04, roughness: 1.0  });

            // Corridor box: z range [-9 to +7], width 4 (x: -2 to +2), height 3.5
            addBox(0, -0.1, -1, 4, 0.2, 16, floorMat);      // floor — same as tomb
            addBox(0,  3.6, -1, 4, 0.2, 16, ceilMat);       // ceiling — same as tomb
            // Side walls — same as tomb walls
            addBox(-2, 1.75, -1, 0.2, 3.5, 16, wallMat);
            addBox( 2, 1.75, -1, 0.2, 3.5, 16, wallMat);

            // Corridor ends at z=+7.5 — door at z=+6.2 seals it when closed
            // (no end-cap wall here; the door + stone panels in buildEgyptExit do the sealing)

            // Torches
            [
                { x: -1.8, z:  2 }, { x:  1.8, z:  2 },
                { x: -1.8, z: -1 }, { x:  1.8, z: -1 },
                { x: -1.8, z: -4 }, { x:  1.8, z: -4 },
            ].forEach(p => spawnTorch(scene, p.x, 2.0, p.z));
        }

        function buildTombRoom() {
            // Stone materials — warm brownish-red like the reference
            const floorMat   = new THREE.MeshStandardMaterial({ color: 0x080400, roughness: 1.0, metalness: 0 });  // match ceiling darkness
            const wallMat    = new THREE.MeshStandardMaterial({ color: 0x4A2D18, roughness: 0.9  });
            const ceilMat    = new THREE.MeshStandardMaterial({ color: 0x080400, roughness: 1.0, metalness: 0 });
            const backWallMat = new THREE.MeshStandardMaterial({ color: 0x5A3520, roughness: 0.85, emissive: 0x3A1A08, emissiveIntensity: 0.4 });
            const exteriorMat = new THREE.MeshStandardMaterial({ color: 0x8B6020, roughness: 1.0 }); // sandstone outside

            // ── Exterior: solid sandstone building that wraps both tomb and corridor ──
            // Use a SINGLE wide box shape so there are no gaps/edges between tomb and corridor.
            // We build exterior walls around the PERIMETER of the combined shape (tomb + corridor T).
            const extMat = new THREE.MeshStandardMaterial({ color: 0xC89040, roughness: 1.0 });

            // Tomb outline: x[-9, 9], z[-27, -9]  (the wider back block)
            // Corridor outline: x[-2, 2], z[-9, 7]  (narrow passage forward)
            // Common roof: use tomb height 5.6 everywhere for a uniform building height

            // === Unified exterior building (tomb + corridor T-shape) ===
            // Build as ONE continuous outer shell, all walls aligned perfectly to avoid edges.
            // Tomb: x[-9.2, 9.2], z[-27.2, -9]
            // Corridor: x[-2.2, 2.2], z[-9, 7.1]
            // Where corridor meets tomb (at z=-9), the corridor walls must EXTEND INTO the tomb
            // wall plane so there's no gap, and tomb's front wall ENDS exactly at corridor edges.

            const EXT_H = 5.6;        // exterior height
            const EXT_YC = EXT_H/2;    // y centre = 2.8
            const WT = 0.8;            // wall thickness — thicker so there are NO gaps

            // === Tomb exterior: x[-9.2, 9.2], z[-9, -27.2] ===
            // Interior side walls span z=-7 to z=-27. Exterior must cover FULL span.
            // Left wall — z from -7 to -27.6 (length 20.6, centred at -17.3)
            addBox(-9.6, EXT_YC, -17.3, WT, EXT_H, 20.6, extMat);
            // Right wall
            addBox( 9.6, EXT_YC, -17.3, WT, EXT_H, 20.6, extMat);
            // Back wall
            addBox( 0,   EXT_YC, -27.6, 20, EXT_H, WT, extMat);
            // Front wall left of corridor opening (corridor is 4 wide centred on x=0)
            // Interior doorway wall spans x=-9 to x=-1.5 on the left. Exterior must cover that.
            // Corridor exterior is at x=±2.6 thickness 0.8. So exterior front wall should go
            // from x=-9.6 (meets tomb left wall) to x=-2.2 (meets corridor left wall edge).
            // Width = 7.4, centred at x=-5.9
            addBox(-5.9, EXT_YC, -9.4, 7.4, EXT_H, WT, extMat);
            addBox( 5.9, EXT_YC, -9.4, 7.4, EXT_H, WT, extMat);

            // === Corridor exterior: x[-2.2, 2.2], z[-9, 7.1] ===
            // Corridor left wall — spans z from -9.4 (into tomb front) to +7.5 (past door)
            // Length = 16.9, centred at z=-0.95
            addBox(-2.6, EXT_YC, -0.95, WT, EXT_H, 16.9, extMat);
            addBox( 2.6, EXT_YC, -0.95, WT, EXT_H, 16.9, extMat);
            // Front wall — left/right of door opening, and above
            addBox(-1.825, EXT_YC, 7.5, 0.75, EXT_H, WT, extMat);
            addBox( 1.825, EXT_YC, 7.5, 0.75, EXT_H, WT, extMat);
            addBox( 0, 4.7, 7.5, 2.9, 1.8, WT, extMat);

            // === Roof — one big slab that covers the entire T-shape ===
            // Tomb roof
            addBox( 0, EXT_H + 0.4, -17.3, 20, 0.8, 20.6, extMat);
            // Corridor roof
            addBox( 0, EXT_H + 0.4, -0.95, 5.4, 0.8, 16.9, extMat);

            // Floor
            addBox( 0, -0.1, -17, 18, 0.2, 20, floorMat);
            // Ceiling
            addBox( 0,  5.2, -17, 18, 0.3, 20, ceilMat);

            // Back wall — emissive orange centre glow
            const backWall = new THREE.Mesh(new THREE.BoxGeometry(18, 5.6, 0.3), backWallMat);
            backWall.position.set(0, 2.6, -27);
            backWall.receiveShadow = true;
            scene.add(backWall);

            // Side walls
            addBox(-9, 2.6, -17, 0.3, 5.6, 20, wallMat);
            addBox( 9, 2.6, -17, 0.3, 5.6, 20, wallMat);

            // Doorway wall — extends fully from side wall to side wall
            // Side walls at x=±9. Opening is 3 wide centred on x=0 (from x=-1.5 to +1.5)
            // Left doorway wall: from x=-9 to x=-1.5, width 7.5, centred at x=-5.25
            addBox(-5.25, 2.6, -9, 7.5, 5.6, 0.3, wallMat);
            // Right doorway wall: from x=+1.5 to x=+9, width 7.5, centred at x=+5.25
            addBox( 5.25, 2.6, -9, 7.5, 5.6, 0.3, wallMat);
            // Lintel above doorway
            addBox(   0, 4.6, -9,   3, 1.5, 0.3, wallMat);

            // Floor tiles
            const groutMat = new THREE.MeshStandardMaterial({ color: 0x251508, roughness: 1.0 });
            for (let i = -4; i <= 4; i++) addBox(i * 2, 0.0, -17, 0.06, 0.015, 20, groutMat);
            for (let j = 0; j <= 9; j++) addBox(0, 0.0, -8 - j * 2.2, 18, 0.015, 0.06, groutMat);

            // === PILLARS ===
            // x: ±3.5 — close to centre aisle but won't clip camera at z:-10
            const PILLAR_X = 3.5;
            const PILLAR_Z  = [-16.0, -20.0, -24.0];  // removed -12 pillars (too close to entrance)

            // === PILLARS ===
            // Build geometry pillars IMMEDIATELY (always visible, no async dependency)
            // GLTF will replace them if it loads successfully
            const pillarMeshGroups = [];
            const pillarMat  = new THREE.MeshStandardMaterial({ color: 0xC8922A, roughness: 0.45, metalness: 0.72, emissive: new THREE.Color(0x6B3D08), emissiveIntensity: 0.4 });
            const baseCapMat = new THREE.MeshStandardMaterial({ color: 0xAA7820, roughness: 0.5,  metalness: 0.65, emissive: new THREE.Color(0x4A2A04), emissiveIntensity: 0.35 });
            const pH = 5.1;
            PILLAR_Z.forEach(zPos => {
                [-PILLAR_X, PILLAR_X].forEach(xPos => {
                    const grp = new THREE.Group();
                    grp.position.set(xPos, 0, zPos);

                    const base = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.35, 1.2), baseCapMat);
                    base.position.y = 0.17; base.receiveShadow = true; grp.add(base);

                    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.52, pH, 8), pillarMat);
                    shaft.position.y = pH / 2 + 0.35; shaft.castShadow = true; shaft.receiveShadow = true; grp.add(shaft);

                    const cap = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.4, 1.15), baseCapMat);
                    cap.position.y = pH + 0.55; cap.receiveShadow = true; grp.add(cap);

                    scene.add(grp);
                    pillarMeshGroups.push(grp);
                });
            });

            // Try loading GLTF — swap geometry if it succeeds
            loader.load('Assets/Models/egyptian_pillar_v1/scene.gltf', (gltf) => {
                // Remove geometry fallbacks
                pillarMeshGroups.forEach(g => scene.remove(g));

                const pillarModel = gltf.scene;
                pillarModel.scale.set(0.5, 0.9, 0.5);

                // FULLY REPLACE all materials with rich ancient gold
                const goldMat = new THREE.MeshStandardMaterial({
                    color:            0xC8922A,   // deep antique gold
                    emissive:         new THREE.Color(0x6B3D08),
                    emissiveIntensity: 0.4,
                    roughness:        0.45,
                    metalness:        0.72,
                });

                pillarModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow    = true;
                        child.receiveShadow = true;
                        child.material      = goldMat; // replace, don't patch
                    }
                });

                PILLAR_Z.forEach(zPos => {
                    const pL = pillarModel.clone(); pL.position.set(-PILLAR_X, 0, zPos); scene.add(pL);
                    const pR = pillarModel.clone(); pR.position.set( PILLAR_X, 0, zPos); pR.rotation.y = Math.PI; scene.add(pR);
                });
            }, undefined, (err) => {
                console.warn('Pillar GLTF not found, using geometry fallback:', err);
                // Geometry pillars already in scene — nothing to do
            });

            // === TORCHES ===
            // Front pair — visible immediately on entry
            placeTorch(scene, -7.0, 2.2, -12.0, 6.0);
            placeTorch(scene,  7.0, 2.2, -12.0, 6.0);
            // Mid pair — lights the colonnade
            placeTorch(scene, -7.0, 2.2, -18.0, 5.5);
            placeTorch(scene,  7.0, 2.2, -18.0, 5.5);
            // Back pair — lights far end and back wall bloom
            placeTorch(scene, -7.0, 2.2, -24.0, 5.0);
            placeTorch(scene,  7.0, 2.2, -24.0, 5.0);

            // Back-wall bloom — warm orange concentrated glow on the far wall
            const backGlow = new THREE.PointLight(0xBB3A08, 5.0, 20);
            backGlow.position.set(0, 2.2, -25.5);
            scene.add(backGlow);

            // Centre ceiling fill so the aisle floor is visible
            const aisleLight = new THREE.PointLight(0x7A3810, 2.5, 18);
            aisleLight.position.set(0, 4.5, -16);
            scene.add(aisleLight);

            // Platform mats (where stations sit)
            const platformMat = new THREE.MeshStandardMaterial({ color: 0x4A2E14, roughness: 0.9 });
            addBox(-6.5, 0.05, -12, 3, 0.06, 3, platformMat);
            addBox(-6.5, 0.05, -22, 3, 0.06, 3, platformMat);
            addBox( 6.5, 0.05, -12, 3, 0.06, 3, platformMat);
            addBox( 6.5, 0.05, -22, 3, 0.06, 3, platformMat);


  // --- SPHINX ---
loader.load('Assets/Models/egyptian_style_sphinx_statue/scene.gltf', (gltf) => {
    const sphinxModel = gltf.scene;
    console.log('Sphinx loaded successfully!');

    // Force a tiny scale first to normalize it
    sphinxModel.scale.setScalar(0.01);
    
    // Now measure
    const box = new THREE.Box3().setFromObject(sphinxModel);
    const size = box.getSize(new THREE.Vector3());
    console.log('RAW sphinx size:', size);

    // Target: sphinx should be ~1.6m tall — medium size
    const targetHeight = 1.6;
    const scaleFactor = targetHeight / size.y;
    sphinxModel.scale.setScalar(0.01 * scaleFactor);
    
    // Re-measure to get floor offset
    const box2 = new THREE.Box3().setFromObject(sphinxModel);
    const offsetY = -box2.min.y;
    console.log('Sphinx offsetY:', offsetY);

    // Replace all materials with a solid sandstone material — the original model's
    // materials may have transparency/opacity issues that make it invisible
    const sandstoneMat = new THREE.MeshStandardMaterial({
        color: 0xC8A060,
        roughness: 0.85,
        metalness: 0.1,
        emissive: 0x3A2A10,
        emissiveIntensity: 0.25
    });

    sphinxModel.traverse(child => {
        if (child.isMesh) {
            child.material = sandstoneMat;
            child.castShadow = true;
            child.receiveShadow = true;
        }
    });

    // ── Sphinxes INSIDE tomb, in the CENTRE aisle near the first pair of columns (z=-16) ──
    // Placed between the columns in the central walkway, heads facing the corridor (+z direction)
    const sxL = sphinxModel.clone();
    sxL.position.set(-1.4, offsetY, -16.0);
    sxL.rotation.y = Math.PI; // face toward +z (the corridor door)
    scene.add(sxL);

    const sxR = sphinxModel.clone();
    sxR.position.set( 1.4, offsetY, -16.0);
    sxR.rotation.y = Math.PI; // face toward +z (the corridor door)
    scene.add(sxR);

    // ── Sphinxes OUTSIDE tomb, flanking the exterior door in the desert (z=+10) ──
    const sxOutL = sphinxModel.clone();
    sxOutL.position.set(-3.0, offsetY, 10.0);
    sxOutL.rotation.y = Math.PI;
    sxOutL.scale.multiplyScalar(1.5);
    scene.add(sxOutL);

    const sxOutR = sphinxModel.clone();
    sxOutR.position.set( 3.0, offsetY, 10.0);
    sxOutR.rotation.y = Math.PI;
    sxOutR.scale.multiplyScalar(1.5);
    scene.add(sxOutR);
}, undefined, err => console.error('Sphinx error:', err));

// --- PHARAOH (with test-cube fallback so something always shows) ---
// First place bright test markers at the intended positions so user can see EXACTLY where they should go
const pharaohMarkerMat = new THREE.MeshBasicMaterial({ color: 0xFFD700 });
const markerL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.8), pharaohMarkerMat);
markerL.position.set(-3.5, 0.9, -10.5);
scene.add(markerL);
const markerR = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.8), pharaohMarkerMat);
markerR.position.set(3.5, 0.9, -10.5);
scene.add(markerR);
console.log('Placed gold marker cubes at cat pharaoh positions');

loader.load('Assets/Models/cat_pharaoh_king/scene.gltf', (gltf) => {
    console.log('Cat pharaoh GLTF loaded!');
    const catModel = gltf.scene;

    catModel.scale.setScalar(0.01);
    const box = new THREE.Box3().setFromObject(catModel);
    const size = box.getSize(new THREE.Vector3());
    console.log('RAW cat pharaoh size:', size);

    // If the model has zero size in Y, something is broken
    if (size.y < 0.001) {
        console.error('Cat pharaoh has zero height! Using markers only.');
        return;
    }

    const targetHeight = 1.8;
    const scaleFactor = targetHeight / size.y;
    catModel.scale.setScalar(0.01 * scaleFactor);

    const box2 = new THREE.Box3().setFromObject(catModel);
    const offsetY = -box2.min.y;
    console.log('Cat pharaoh offsetY:', offsetY);

    let meshCount = 0;
    catModel.traverse(c => { if (c.isMesh) meshCount++; });
    console.log('Cat pharaoh mesh count:', meshCount);

    if (meshCount === 0) {
        console.error('Cat pharaoh has NO meshes! Using markers only.');
        return;
    }

    catModel.traverse(child => {
        if (child.isMesh) {
            // MeshBasicMaterial = always fully visible, no lighting required
            child.material = new THREE.MeshBasicMaterial({
                color: 0xFFD700,
                side: THREE.DoubleSide
            });
            child.visible = true;
            child.frustumCulled = false;
            child.renderOrder = 10; // render AFTER everything else so nothing occludes it
        }
    });

    // Model loaded successfully — remove the test markers and place real models
    scene.remove(markerL);
    scene.remove(markerR);

    const catL = catModel.clone();
    catL.position.set(-3.5, offsetY, -10.5);
    catL.rotation.y = Math.PI / 6;
    scene.add(catL);

    const catR = catModel.clone();
    catR.position.set(3.5, offsetY, -10.5);

        function buildWallPaintings() {
            // Called for both tomb side walls AND corridor walls
            // Tomb side walls: x=±9 inner face, z centre -17, length 20
            // Corridor walls: x=±2 inner face, z centre -2, length 14

            function drawEgyptMural(cw, ch, seed) {
                const canvas = document.createElement('canvas');
                canvas.width = cw; canvas.height = ch;
                const ctx = canvas.getContext('2d');

                // ── Sandy ochre stone base ──
                const grad = ctx.createLinearGradient(0,0,0,ch);
                grad.addColorStop(0,   '#D4A855');
                grad.addColorStop(0.4, '#C89840');
                grad.addColorStop(1,   '#A07830');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);

                // Age stains
                ctx.globalAlpha = 0.08;
                for (let i=0;i<60;i++){
                    const sx=(i/60)*cw+Math.sin(i)*30;
                    ctx.fillStyle = i%3===0?'#7A4A10':i%3===1?'#E8C870':'#5A3010';
                    ctx.fillRect(sx,0,1+Math.random()*4,ch);
                }
                ctx.globalAlpha = 1;

                // ── Frieze bands top & bottom ──
                const FB = Math.round(ch*0.14);
                // Top band
                ctx.fillStyle='#8B3A0A'; ctx.fillRect(0,0,cw,FB);
                // Decorative stripe inside top band
                ctx.fillStyle='#F5C040'; ctx.fillRect(0,FB-4,cw,4);
                ctx.fillStyle='#5A1800'; ctx.fillRect(0,0,cw,3);

                // Bottom band
                ctx.fillStyle='#8B3A0A'; ctx.fillRect(0,ch-FB,cw,FB);
                ctx.fillStyle='#F5C040'; ctx.fillRect(0,ch-FB,cw,4);
                ctx.fillStyle='#5A1800'; ctx.fillRect(0,ch-3,cw,3);

                // Hieroglyphs in bands - repeating rows
                const GLYPHS = ['𓂀','𓆣','𓇳','𓏏','𓆑','𓃭','𓂋','𓅓','𓆗','𓏲','𓇯','𓏭','𓄿','𓇋','𓏲','𓃒'];
                const gSize = Math.round(FB * 0.65);
                ctx.font = `${gSize}px serif`;
                ctx.fillStyle = '#F5D080';
                ctx.textAlign = 'left';
                const step = gSize + 4;
                for (let gx=0; gx<cw; gx+=step) {
                    const gi = Math.floor(gx/step + seed) % GLYPHS.length;
                    ctx.fillText(GLYPHS[gi], gx+2, FB-4);
                    ctx.fillText(GLYPHS[(gi+7)%GLYPHS.length], gx+2, ch-5);
                }

                // ── Scene area ──
                const SY = FB + 2;
                const SH = ch - FB*2 - 4;
                const GY = SY + SH; // ground line y

                // Ground register line
                ctx.strokeStyle='#6B3010'; ctx.lineWidth=2;
                ctx.beginPath(); ctx.moveTo(0,GY-2); ctx.lineTo(cw,GY-2); ctx.stroke();

                // Top register line
                ctx.beginPath(); ctx.moveTo(0,SY+2); ctx.lineTo(cw,SY+2); ctx.stroke();

                // ── Figure drawing ──
                function fig(x, scl, dir, type) {
                    // type: 0=pharaoh, 1=priest, 2=god, 3=worker, 4=seated
                    ctx.save();
                    ctx.translate(x, GY);
                    ctx.scale(dir * scl, scl);

                    const H = 160; // figure height in canvas units
                    const skin  = type===2?'#8B4513': type===3?'#A0522D':'#CD853F';
                    const kilt  = type===2?'#DAA520': type===1?'#F5F5DC':'#FFFFFF';
                    const crown = type===0?'#1E5A8A': type===2?'#DAA520':'none';

                    // Legs (stride pose)
                    ctx.fillStyle=skin;
                    ctx.fillRect(-6, -H*0.47, 10, H*0.47);  // back leg
                    ctx.fillRect(8,  -H*0.50, 10, H*0.47);  // front leg

                    // Kilt/skirt
                    ctx.fillStyle=kilt;
                    ctx.beginPath();
                    ctx.moveTo(-8,-H*0.47); ctx.lineTo(22,-H*0.47);
                    ctx.lineTo(20,-H*0.27); ctx.lineTo(-6,-H*0.27);
                    ctx.closePath(); ctx.fill();
                    ctx.strokeStyle='#8B6914'; ctx.lineWidth=1; ctx.stroke();
                    if(type===2){// gold belt
                        ctx.strokeStyle='#FFD700'; ctx.lineWidth=2;
                        ctx.beginPath();ctx.moveTo(-8,-H*0.47);ctx.lineTo(22,-H*0.47);ctx.stroke();
                    }

                    // Torso
                    ctx.fillStyle=skin;
                    ctx.fillRect(-6,-H*0.77, 26, H*0.31);

                    // Collar necklace
                    ctx.strokeStyle='#DAA520'; ctx.lineWidth=3;
                    ctx.beginPath(); ctx.arc(7,-H*0.65,14,-Math.PI*0.8,0.1); ctx.stroke();
                    // Collar beads
                    ctx.fillStyle='#1E5A8A';
                    for(let b=0;b<5;b++){
                        const ba=-Math.PI*0.75+b*(Math.PI*0.85/4);
                        ctx.beginPath(); ctx.arc(7+Math.cos(ba)*14,-H*0.65+Math.sin(ba)*14,2.5,0,Math.PI*2); ctx.fill();
                    }

                    // Head (profile)
                    ctx.fillStyle=skin;
                    ctx.beginPath(); ctx.ellipse(8,-H*0.88,12,15,-0.1,0,Math.PI*2); ctx.fill();

                    // Crown/headdress
                    if(type===0){ // nemes blue+gold stripes
                        ctx.fillStyle='#1E5A8A';
                        ctx.beginPath();
                        ctx.moveTo(-4,-H*0.98); ctx.lineTo(20,-H*0.98);
                        ctx.lineTo(18,-H*0.77); ctx.lineTo(-2,-H*0.77);
                        ctx.closePath(); ctx.fill();
                        ctx.fillStyle='#DAA520';
                        for(let s=0;s<4;s++) ctx.fillRect(-3+s*5,-H*0.98,3,H*0.21);
                        // uraeus
                        ctx.fillStyle='#C03020';
                        ctx.beginPath(); ctx.arc(18,-H*0.98,4,0,Math.PI*2); ctx.fill();
                    } else if(type===2){ // tall white double crown
                        ctx.fillStyle='#F5F5DC';
                        ctx.fillRect(0,-H*1.22,16,H*0.25);
                        ctx.beginPath(); ctx.arc(8,-H*1.22,8,Math.PI,0); ctx.fill();
                        ctx.fillStyle='#C03020'; // red inner
                        ctx.fillRect(3,-H*1.18,10,H*0.18);
                    } else if(type===1){ // shaved or wig
                        ctx.fillStyle='#1A0A00';
                        ctx.beginPath(); ctx.ellipse(7,-H*0.90,11,13,0,0,Math.PI*2); ctx.fill();
                    }

                    // Eye (kohl-lined profile)
                    ctx.fillStyle='#1A0A00';
                    ctx.beginPath(); ctx.ellipse(16,-H*0.86,5,3,0,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#FFFFFF';
                    ctx.beginPath(); ctx.ellipse(15,-H*0.86,3,2,0,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#1A0A00';
                    ctx.beginPath(); ctx.arc(16,-H*0.86,2,0,Math.PI*2); ctx.fill();
                    // kohl line
                    ctx.strokeStyle='#000'; ctx.lineWidth=1.5;
                    ctx.beginPath(); ctx.moveTo(20,-H*0.84); ctx.lineTo(26,-H*0.80); ctx.stroke();

                    // Forward arm (offering)
                    ctx.strokeStyle=skin; ctx.lineWidth=7;
                    ctx.beginPath(); ctx.moveTo(8,-H*0.68); ctx.lineTo(34,-H*0.55); ctx.stroke();
                    ctx.fillStyle=skin;
                    ctx.beginPath(); ctx.arc(34,-H*0.53,6,0,Math.PI*2); ctx.fill();

                    // Back arm (down)
                    ctx.beginPath(); ctx.moveTo(4,-H*0.68); ctx.lineTo(-2,-H*0.50); ctx.stroke();

                    // Worker variant: bent carrying pose
                    if(type===3){
                        ctx.strokeStyle=skin; ctx.lineWidth=7;
                        ctx.beginPath(); ctx.moveTo(8,-H*0.68); ctx.lineTo(10,-H*0.45); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(4,-H*0.68); ctx.lineTo(-8,-H*0.78); ctx.stroke();
                        // load on back
                        ctx.fillStyle='#8B6914';
                        ctx.fillRect(-14,-H*0.88,12,18);
                    }

                    ctx.restore();
                }

                // ── Glyph column ──
                function glyphCol(x, n, off) {
                    const gs2 = Math.round(SH*0.11);
                    ctx.font=`${gs2}px serif`; ctx.fillStyle='#5A2800'; ctx.textAlign='center';
                    for(let i=0;i<n;i++) ctx.fillText(GLYPHS[(off+i)%GLYPHS.length], x, SY+14+i*(gs2+2));
                }

                // ── Decorative elements ──
                function lotus(x) {
                    ctx.strokeStyle='#2A7A30'; ctx.lineWidth=2;
                    ctx.beginPath(); ctx.moveTo(x,GY-2); ctx.lineTo(x,GY-SH*0.4); ctx.stroke();
                    const ly=GY-SH*0.4;
                    const pColors=['#E860A0','#C040A0','#FF80C0','#D050B0','#F070B0'];
                    for(let p=0;p<5;p++){
                        const a=(p/5)*Math.PI*2-Math.PI/2;
                        ctx.fillStyle=pColors[p];
                        ctx.beginPath();
                        ctx.ellipse(x+Math.cos(a)*10,ly+Math.sin(a)*10,5,12,a,0,Math.PI*2);
                        ctx.fill();
                    }
                    ctx.fillStyle='#FFD700';
                    ctx.beginPath(); ctx.arc(x,ly,7,0,Math.PI*2); ctx.fill();
                }

                function ankh(x, y, s) {
                    ctx.strokeStyle='#DAA520'; ctx.lineWidth=s*3;
                    ctx.beginPath(); ctx.moveTo(x,y-s*6); ctx.lineTo(x,y+s*14); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(x-s*6,y); ctx.lineTo(x+s*6,y); ctx.stroke();
                    ctx.beginPath(); ctx.arc(x,y-s*6,s*5,0,Math.PI*2); ctx.stroke();
                }

                function altar(x) {
                    const ay=GY;
                    ctx.fillStyle='#7A4A18';
                    ctx.fillRect(x-28,ay-SH*0.18,56,8);
                    ctx.fillRect(x-22,ay-SH*0.18+8,8,SH*0.18-8);
                    ctx.fillRect(x+14,ay-SH*0.18+8,8,SH*0.18-8);
                    // offerings
                    ctx.fillStyle='#C03020'; ctx.beginPath(); ctx.arc(x-10,ay-SH*0.18-8,7,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#E8C040'; ctx.beginPath(); ctx.arc(x+10,ay-SH*0.18-8,6,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#40A040'; ctx.fillRect(x-4,ay-SH*0.18-24,8,16);
                }

                function scarab(x,y) {
                    ctx.fillStyle='#2040C0';
                    ctx.beginPath(); ctx.ellipse(x,y,14,18,0,0,Math.PI*2); ctx.fill();
                    ctx.strokeStyle='#6080FF'; ctx.lineWidth=1.5;
                    ctx.beginPath();ctx.moveTo(x,y-16);ctx.lineTo(x,y+16);ctx.stroke();
                    ctx.beginPath();ctx.moveTo(x-14,y);ctx.lineTo(x+14,y);ctx.stroke();
                    ctx.fillStyle='#FFD700';
                    ctx.beginPath(); ctx.arc(x,y-26,9,0,Math.PI*2); ctx.fill();
                }

                function sunDisc(x,y,r) {
                    ctx.fillStyle='#FFD700';
                    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
                    ctx.strokeStyle='#FF8C00'; ctx.lineWidth=2; ctx.stroke();
                    for(let i=0;i<12;i++){
                        const a=(i/12)*Math.PI*2;
                        ctx.beginPath();
                        ctx.moveTo(x+Math.cos(a)*(r+2),y+Math.sin(a)*(r+2));
                        ctx.lineTo(x+Math.cos(a)*(r+10),y+Math.sin(a)*(r+10));
                        ctx.strokeStyle='#FFD700'; ctx.lineWidth=1.5; ctx.stroke();
                    }
                }

                // ── Layout: repeating sections ──
                const SEC = Math.round(cw * 0.22); // section width ~22% of canvas
                const nSec = Math.ceil(cw / SEC) + 1;
                const figH = SH * 0.95;
                const figScale = figH / 160;

                for(let s=0; s<nSec; s++){
                    const ox = s * SEC;
                    const sc = (s + seed) % 5;

                    glyphCol(ox+18, 5, (s*3+seed)%GLYPHS.length);

                    if(sc===0){
                        // Pharaoh offering to god at altar
                        fig(ox+70,  figScale*0.9,  1, 0); // pharaoh
                        fig(ox+170, figScale*0.85, 1, 1); // priest
                        altar(ox+SEC*0.58);
                        fig(ox+SEC*0.72, figScale*0.95,-1, 2); // god
                        ankh(ox+SEC*0.58, GY-SH*0.55, figScale*8);
                        scarab(ox+SEC*0.58, SY+SH*0.22);

                    } else if(sc===1){
                        // Procession of workers
                        fig(ox+50,  figScale*0.9,  1, 2);
                        fig(ox+130, figScale*0.8,  1, 3);
                        fig(ox+195, figScale*0.8,  1, 3);
                        fig(ox+260, figScale*0.8,  1, 1);
                        lotus(ox+SEC*0.8);
                        lotus(ox+SEC*0.45);
                        sunDisc(ox+SEC*0.62, SY+SH*0.28, SH*0.12);

                    } else if(sc===2){
                        // Weighing of the heart
                        fig(ox+60,  figScale*0.9,  1, 2);
                        fig(ox+SEC*0.85, figScale*0.85,-1, 1);
                        // Scales of Ma'at
                        const sx=ox+SEC*0.5, sb=SY+SH*0.15;
                        ctx.strokeStyle='#DAA520'; ctx.lineWidth=3;
                        ctx.beginPath();ctx.moveTo(sx,sb);ctx.lineTo(sx,sb+SH*0.55);ctx.stroke();
                        ctx.beginPath();ctx.moveTo(sx-SEC*0.2,sb+SH*0.1);ctx.lineTo(sx+SEC*0.2,sb+SH*0.1);ctx.stroke();
                        ctx.beginPath();ctx.moveTo(sx-SEC*0.2,sb+SH*0.1);ctx.lineTo(sx-SEC*0.2,sb+SH*0.38);ctx.stroke();
                        ctx.arc(sx-SEC*0.2,sb+SH*0.40,SEC*0.08,0,Math.PI); ctx.stroke();
                        ctx.beginPath();ctx.moveTo(sx+SEC*0.2,sb+SH*0.1);ctx.lineTo(sx+SEC*0.2,sb+SH*0.28);ctx.stroke();
                        ctx.beginPath();ctx.arc(sx+SEC*0.2,sb+SH*0.30,SEC*0.08,0,Math.PI); ctx.stroke();
                        ctx.font=`${SH*0.18}px serif`; ctx.textAlign='center';
                        ctx.fillStyle='#C03020'; ctx.fillText('𓃒',sx-SEC*0.2,sb+SH*0.41);
                        ctx.fillStyle='#F5D080'; ctx.fillText('𓆃',sx+SEC*0.2,sb+SH*0.31);
                        ctx.font=`bold ${SH*0.3}px serif`; ctx.fillStyle='#F5D080';
                        ctx.fillText('𓂀',sx,SY+SH*0.35);

                    } else if(sc===3){
                        // Solar barque procession
                        fig(ox+60,  figScale*0.9,  1, 0);
                        fig(ox+145, figScale*0.8,  1, 1);
                        fig(ox+SEC*0.75, figScale*0.85,-1, 1);
                        fig(ox+SEC*0.9,  figScale*0.9, -1, 2);
                        // barque
                        const bx=ox+SEC*0.52, by=GY-SH*0.32;
                        ctx.fillStyle='#C8922A'; ctx.strokeStyle='#DAA520'; ctx.lineWidth=2;
                        ctx.beginPath();
                        ctx.moveTo(bx-SEC*0.16,by);
                        ctx.quadraticCurveTo(bx,by+SH*0.12,bx+SEC*0.16,by);
                        ctx.quadraticCurveTo(bx,by-SH*0.04,bx-SEC*0.16,by);
                        ctx.fill(); ctx.stroke();
                        sunDisc(bx, by-SH*0.18, SH*0.11);
                        lotus(ox+SEC*0.52-SEC*0.1);
                        lotus(ox+SEC*0.52+SEC*0.1);

                    } else {
                        // Animal-headed gods ceremony
                        fig(ox+60,  figScale*0.9, 1, 2);
                        fig(ox+150, figScale*0.85,1, 0);
                        fig(ox+240, figScale*0.8, 1, 1);
                        altar(ox+SEC*0.62);
                        fig(ox+SEC*0.78, figScale*0.9,-1, 2);
                        ankh(ox+SEC*0.3, GY-SH*0.5, figScale*7);
                        scarab(ox+SEC*0.15, SY+SH*0.25);
                    }
                }

                return canvas;
            }

            // ── Load the mural texture once, apply to all walls ──
            const muralLoader = new THREE.TextureLoader();

            // Show canvas fallback immediately, swap to real photo when loaded
            const fallbackCanvas = drawEgyptMural(4096, 512, 0);
            const fallbackTex = new THREE.CanvasTexture(fallbackCanvas);

            // All mural materials share the same texture (one load)
            const muralMats = [];

            function muralMesh(w, h, pos, rotY) {
                const mat = new THREE.MeshBasicMaterial({ map: fallbackTex, side: THREE.FrontSide });
                muralMats.push(mat);
                const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
                mesh.position.copy(pos);
                mesh.rotation.y = rotY;
                scene.add(mesh);
                return mesh;
            }

            // ── MURAL BANDS — thick horizontal strip in middle, wall colour shows above/below ──
            // Band is 1.8m tall, centred at y=1.8 (from y=0.9 to y=2.7)
            // Wall colour shows below (y=0 to 0.9) and above (y=2.7 to 5.4)
            const BAND_H = 1.8;
            const BAND_Y = 1.8;

        function onSelectStart(event) {
            const controller = event.target;
            raycaster.setFromXRController(controller);
            const hits = raycaster.intersectObjects(grabbableObjects, true);
            if (hits.length > 0) {
                const object = hits[0].object;
                // Lever: pull it down instead of attaching
                let leverObj = object;
                while (leverObj && !leverObj.userData.type) leverObj = leverObj.parent;
                if (leverObj && leverObj.userData.type === 'lever') {
                    scene.userData.leverPulled = true;
                    scene.userData.leverT = 0;
                    console.log('Lever pulled! (VR controller)');
                    return;
                }
                controller.attach(object);
                controller.userData.selected = object;
                if(object.userData.type === 'scrollPiece') controller.userData.selectedType = 'scroll';
                if(object.userData.type === 'weight') controller.userData.selectedType = 'weight';
            }
        }

        function onSelectEnd(event) {
            const controller = event.target;
            const obj = controller.userData.selected;
            if (!obj) return;
            scene.attach(obj);
            const type = controller.userData.selectedType;
            if (type === 'scroll') {
                const target = scrollSnapTargets[obj.name];
                if (target && obj.position.distanceTo(target) < 0.3) {
                    obj.position.copy(target);
                    obj.rotation.set(-Math.PI / 2, 0, 0);
                    scrollSolved.add(obj.name);
                    if (scrollSolved.size === 4) solveStation1();
                }
            }
            controller.userData.selected = undefined;
        }

        function solveStation1() {
            station1Solved = true;
            const s2Light = scene.getObjectByName('station2Light');
            if (s2Light) s2Light.intensity = 4.5;

        function placeTorch(parent, x, y, z, lightIntensity = 1.5) {
            if (!torchTemplate) {
                pendingTorchPlacements.push({ parent, x, y, z, lightIntensity });
                return;
            }
            const torch = torchTemplate.clone();
            torch.position.set(x, y, z);
            parent.add(torch);

            // Main warm torch light
            const light = new THREE.PointLight(0xFF5500, lightIntensity, 14);
            light.position.set(x, y + 0.4, z);
            light.castShadow = true;
            light.shadow.mapSize.width  = 256;
            light.shadow.mapSize.height = 256;
            parent.add(light);

            // Secondary subtle fill — slightly cooler colour for depth
            const fill = new THREE.PointLight(0xFF2200, lightIntensity * 0.35, 8);
            fill.position.set(x, y + 0.1, z);
            parent.add(fill);

            // Register both for flicker with individual random phase offset
            torchLights.push({ light, fill, baseIntensity: lightIntensity, phase: Math.random() * Math.PI * 2 });
        }

        function spawnTorch(parent, x, y, z) { placeTorch(parent, x, y, z, 1.5); }

        function handleKeyboard() {
            const delta = 1 / 60;
            const speed = 3.0;
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0; forward.normalize();
            const right = new THREE.Vector3();
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
            if (keys['w']) cameraRig.position.addScaledVector(forward,  speed * delta);
            if (keys['s']) cameraRig.position.addScaledVector(forward, -speed * delta);
            if (keys['a']) cameraRig.position.addScaledVector(right,   -speed * delta);
            if (keys['d']) cameraRig.position.addScaledVector(right,    speed * delta);
            // Press E or SPACE to pull the lever (desktop fallback)
            if ((keys['e'] || keys[' ']) && !scene.userData.leverPulled) {
                scene.userData.leverPulled = true;
                scene.userData.leverT = 0;
                console.log('Lever pulled! (keyboard E/SPACE)');
            }
        }

        function handleLocomotion() {
            const session = renderer.xr.getSession();
            if (!session) return;
            const delta = 1 / 72;
            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                const axes = source.gamepad.axes;
                if (source.handedness === 'left') {
                    const moveX = axes[2] ?? 0;
                    const moveZ = axes[3] ?? 0;
                    const forward = new THREE.Vector3();
                    camera.getWorldDirection(forward);
                    forward.y = 0; forward.normalize();
                    const right = new THREE.Vector3();
                    right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
                    cameraRig.position.addScaledVector(forward, -moveZ * moveSpeed * delta);
                    cameraRig.position.addScaledVector(right,    moveX * moveSpeed * delta);
                }
                if (source.handedness === 'right') {
                    const rotX = axes[2] ?? 0;
                    if (rotX > 0.7 && canSnapRight) { cameraRig.rotation.y -= snapAngle; canSnapRight = false; }
                    else if (rotX < -0.7 && canSnapLeft) { cameraRig.rotation.y += snapAngle; canSnapLeft = false; }
                    if (Math.abs(rotX) < 0.3) { canSnapLeft = true; canSnapRight = true; }
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            handleKeyboard();
            handleLocomotion();

            // === TORCH FLICKER ===
            const t = performance.now() * 0.001; // seconds
            torchLights.forEach(({ light, fill, baseIntensity, phase }) => {
                // Layered sin waves at different frequencies = organic flicker
                const flicker =
                    Math.sin(t * 7.3  + phase)        * 0.18 +
                    Math.sin(t * 13.7 + phase * 1.3)  * 0.10 +
                    Math.sin(t * 3.1  + phase * 0.7)  * 0.08 +
                    Math.random()                      * 0.06; // tiny random spike
                light.intensity = Math.max(0, baseIntensity * (1.0 + flicker));
                fill.intensity  = Math.max(0, baseIntensity * 0.35 * (1.0 + flicker * 0.5));

                // Slight colour temperature shift — flicker between orange and deep amber
                const r = Math.min(1, 1.0);
                const g = Math.max(0.18, 0.30 + flicker * 0.15);
                light.color.setRGB(r, g, 0.02);
            });

            // === COLLISION: block player from walking through closed door ===
            // Check if door is lifted enough to walk under (lift > 2.5 means door is mostly up)
            if (scene.userData.DOOR_Z !== undefined) {
                const doorLift = scene.userData.doorSlab ? (scene.userData.doorSlab.position.y - scene.userData.doorSlab.userData.closedY) : 0;
                if (doorLift < 2.5 && cameraRig.position.z > scene.userData.DOOR_Z - 0.5) {
                    cameraRig.position.z = scene.userData.DOOR_Z - 0.5;
                }
            }

            // === LEVER ANIMATION ===
            if (scene.userData.leverPulled && leverArm && (scene.userData.leverT || 0) < 1) {
                scene.userData.leverT = Math.min(1, (scene.userData.leverT || 0) + 0.025);
                const lt = scene.userData.leverT;
                const angle = lt * Math.PI * 0.5;
                // Arm pivots from its BASE (bracket), which is at local y=0, z=0.25
                // Move arm so its base is at local y=0 then rotate, then reposition
                const L = 0.35; // half-arm length
                leverArm.position.set(0, L * Math.cos(angle), 0.25 + L * Math.sin(angle));
                leverArm.rotation.x = angle;
                // Knob follows the top of the arm
                if (leverArm.userData.knob) {
                    leverArm.userData.knob.position.set(
                        0,
                        (2 * L) * Math.cos(angle),
                        0.25 + (2 * L) * Math.sin(angle)
                    );
                }
                // Switch indicator light from red to green
                if (leverArm.userData.light) {
                    leverArm.userData.light.color.setHex(0x20FF20);
                }
            }

            // === BACKGROUND: show Egypt sky once lever is pulled (door opening = sky visible) ===
            if (scene.userData.egyptStartZ !== undefined) {
                if (scene.userData.leverPulled) {
                    // Lever pulled → door opening → show Egypt sky
                    scene.fog = null;
                    scene.background = scene.userData.egyptBg || new THREE.Color(0x4A9AE8);
                } else {
                    // Still locked in tomb
                    if (!scene.fog) scene.fog = new THREE.FogExp2(0x0A0402, 0.018);
                    scene.background = scene.userData.tombBg || new THREE.Color(0x0A0402);
                }
            }

            // === DOOR ANIMATION — slab slides UP when lever pulled (portcullis) ===
            if (scene.userData.doorSlab) {
                if (scene.userData.leverPulled && !scene.userData.doorOpen) {
                    scene.userData.doorOpen = true;
                }
                if (scene.userData.doorOpen && scene.userData.doorT < 1) {
                    scene.userData.doorT = Math.min(1, scene.userData.doorT + 0.018);
                    const t = scene.userData.doorT;
                    // Ease-out for smooth stop at top
                    const ease = 1 - Math.pow(1 - t, 2);
                    const lift = ease * 4.0; // total lift distance
                    scene.userData.doorSlab.position.y = scene.userData.doorSlab.userData.closedY + lift;
                }
            }

            renderer.render(scene, camera);
        }

    </script>
</body>
